[project]
name = "taiex"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0.3",
    "requests>=2.31",
    "yfinance>=1.4.1",
]

[dependency-groups]
dev = [
    "pandas-stubs>=3.0.5.260914",
    "pyright>=1.1.414",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.pyright]
include = ["*.py", "scripts", "tests"]
pythonVersion = "3.12"
