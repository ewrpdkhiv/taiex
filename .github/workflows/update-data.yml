name: Update static data

on:
  schedule:
    # 台灣時間下午 3 點（UTC 07:00），週一到週五收盤後更新
    - cron: "0 7 * * 1-5"
  workflow_dispatch:
  # 推送程式碼到 main 後也更新一次，讓前端／產生器的修改立刻反映到資料上；
  # 只改到資料檔的 push 不觸發（bot 用 GITHUB_TOKEN 推的 commit 本來就不會再觸發 workflow）
  push:
    branches: [main]
    paths-ignore:
      - "docs/data/**"
      - "cache/**"

# 同時只跑一個更新，避免排程與 push 觸發的兩次執行互相推送衝突
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Generate static data
        run: uv run python scripts/generate_static.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/ cache/
          git diff --staged --quiet || git commit -m "chore: update static data [skip ci]"
          # 執行期間 main 可能又有新的 push，先 rebase 再推
          git pull --rebase
          git push

      - name: Notify on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          BODY="工作流程執行失敗：${RUN_URL}"
          ISSUE_NUM=$(gh issue list --repo "$GITHUB_REPOSITORY" --search "Data update failed in:title" --state open --json number --jq '.[0].number')
          if [ -n "$ISSUE_NUM" ]; then
            gh issue comment "$ISSUE_NUM" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "⚠️ Data update failed" --body "$BODY"
          fi
