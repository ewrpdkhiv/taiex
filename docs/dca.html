<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>定期定額試算</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="theme.css" />
    <script src="theme.js"></script>
    <style>
      .container {
        max-width: 1120px;
        margin: 0 auto 40px;
        padding: 0 24px;
      }
      #error-banner {
        margin-bottom: 12px;
      }

      /* 回測設定 */
      .info-bar {
        background: var(--surface);
        border: 1px solid var(--rule);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 14px 18px;
        margin-bottom: 12px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px 18px;
        align-items: center;
        font-size: 0.84rem;
        color: var(--ink-2);
      }
      .info-bar b {
        color: var(--ink);
        font-weight: 600;
      }
      .info-bar .period {
        margin-left: auto;
        font-size: 0.8rem;
        color: var(--ink-3);
      }
      .info-bar .period b {
        color: var(--ink-2);
        font-family: var(--font-mono);
        font-weight: 500;
      }

      .period-btns {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        width: 100%;
        padding-top: 10px;
        border-top: 1px solid var(--rule);
      }
      .period-btn {
        background: transparent;
        border: 1px solid var(--rule-strong);
        border-radius: 999px;
        padding: 4px 14px;
        font-size: 0.8rem;
        color: var(--ink-2);
        cursor: pointer;
        transition: all 0.15s;
      }
      .period-btn:hover {
        border-color: var(--ink-3);
        color: var(--ink);
      }
      .period-btn.active {
        background: var(--ink);
        border-color: var(--ink);
        color: var(--surface);
        font-weight: 600;
      }
      .period-btn.crash {
        border-color: var(--danger-line);
        color: var(--danger);
      }
      .period-btn.crash:hover {
        background: var(--danger-soft);
      }
      .period-btn.crash.active {
        background: var(--danger);
        border-color: var(--danger);
        color: var(--surface);
      }

      /* 篩選／欄位列 */
      .filter-bar,
      .col-toggle-bar {
        padding: 4px 2px;
        margin-bottom: 8px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      .col-toggle-bar {
        gap: 6px;
        margin-bottom: 12px;
      }
      .filter-group {
        display: flex;
        gap: 4px;
        align-items: center;
        flex-wrap: wrap;
      }
      .filter-group + .filter-group {
        padding-left: 12px;
        border-left: 1px solid var(--rule-strong);
      }
      .filter-label {
        font-size: 0.74rem;
        color: var(--ink-3);
        margin-right: 2px;
        white-space: nowrap;
      }

      /* 表格 */
      .table-wrap {
        background: var(--surface);
        border: 1px solid var(--rule);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
      }
      th:first-child {
        text-align: center;
        width: 40px;
      }
      th:nth-child(2) {
        text-align: left;
        width: 130px;
      }
      .th-sort {
        cursor: pointer;
        user-select: none;
      }
      .th-sort:hover {
        color: var(--ink);
      }
      .th-active {
        cursor: pointer;
        user-select: none;
        color: var(--accent);
      }
      .sort-arrow {
        font-size: 0.7rem;
        margin-left: 3px;
      }
      td:nth-child(1) {
        text-align: center;
        color: var(--ink-3);
        font-size: 0.75rem;
        font-weight: 600;
        font-family: var(--font-mono);
      }
      td:nth-child(2) {
        text-align: left;
        max-width: 130px;
      }
      tbody tr {
        cursor: pointer;
      }
      tbody tr.selected td {
        background: var(--accent-soft);
      }
      tbody tr.selected td:nth-child(1) {
        color: var(--accent);
      }

      .ticker {
        font-weight: 700;
        color: var(--ink);
        font-size: 0.88rem;
        font-family: var(--font-mono);
      }
      .name {
        color: var(--ink-3);
        font-size: 0.74rem;
        margin-top: 1px;
      }
      .pos,
      .neg,
      .mid {
        font-weight: 700;
        font-family: var(--font-mono);
      }
      .pos {
        color: var(--up);
      }
      .neg {
        color: var(--down);
      }
      .mid {
        color: var(--warn);
      }
      .sub {
        font-size: 0.74rem;
        color: var(--ink-3);
        margin-top: 2px;
      }

      .bar-wrap {
        display: flex;
        align-items: center;
        gap: 10px;
        justify-content: flex-end;
      }
      .bar {
        height: 5px;
        border-radius: 999px;
        min-width: 2px;
        background: var(--up);
        opacity: 0.75;
        flex-shrink: 0;
      }
      .bar.neg-bar {
        background: var(--down);
      }

      /* 區段標題 */
      .section-head {
        margin: 36px 0 12px;
      }
      .section-head h2 {
        font-family: var(--font-serif);
        font-size: 1.2rem;
        font-weight: 700;
        color: var(--ink);
        margin-bottom: 4px;
      }
      .section-head p {
        font-size: 0.82rem;
        color: var(--ink-3);
        max-width: 760px;
      }
      .section-head b {
        color: var(--ink-2);
      }

      /* 底部組合列 */
      #portfolio-bar {
        display: none;
        position: fixed;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        width: min(1072px, calc(100% - 24px));
        background: var(--surface);
        border: 1px solid var(--rule-strong);
        border-radius: 14px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.18);
        padding: 12px 18px;
        z-index: 200;
        gap: 16px;
        align-items: center;
        flex-wrap: wrap;
      }
      #portfolio-bar.visible {
        display: flex;
      }
      .portfolio-label {
        font-size: 0.74rem;
        font-weight: 600;
        color: var(--ink-3);
        white-space: nowrap;
      }
      .portfolio-chips {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        flex: 1;
      }
      .portfolio-chip {
        background: var(--accent-soft);
        border: 1px solid var(--accent-line);
        color: var(--accent);
        border-radius: 999px;
        padding: 2px 10px;
        font-size: 0.76rem;
        font-family: var(--font-mono);
        cursor: pointer;
      }
      .portfolio-chip:hover {
        border-color: var(--accent);
      }
      .portfolio-stats {
        display: flex;
        gap: 20px;
        align-items: center;
        flex-wrap: wrap;
      }
      .portfolio-hint {
        font-size: 0.76rem;
        color: var(--ink-3);
      }
      .portfolio-stat {
        text-align: right;
      }
      .portfolio-stat .s-label {
        font-size: 0.68rem;
        color: var(--ink-3);
        display: block;
      }
      .portfolio-stat .s-val {
        font-family: var(--font-mono);
        font-size: 0.9rem;
        font-weight: 700;
        color: var(--ink);
      }
      .portfolio-stat .s-val.pos {
        color: var(--up);
      }
      .portfolio-stat .s-val.neg {
        color: var(--down);
      }
      .portfolio-clear {
        background: none;
        border: 1px solid var(--rule-strong);
        color: var(--ink-2);
        border-radius: 6px;
        padding: 4px 12px;
        font-size: 0.76rem;
        cursor: pointer;
        white-space: nowrap;
      }
      .portfolio-clear:hover {
        border-color: var(--danger);
        color: var(--danger);
      }
      body.has-portfolio {
        padding-bottom: 96px;
      }

      @media (max-width: 600px) {
        .container {
          padding: 0 8px;
        }
        .info-bar {
          flex-direction: column;
          align-items: flex-start;
          gap: 8px;
          padding: 12px 14px;
        }
        .info-bar .period {
          margin-left: 0;
        }
        .filter-group + .filter-group {
          padding-left: 0;
          border-left: none;
        }
        table {
          min-width: 340px;
        }
        th:first-child,
        td:nth-child(1) {
          position: sticky;
          left: 0;
          background: var(--surface);
          z-index: 1;
        }
        th:first-child {
          background: var(--surface-2);
        }
        .bar {
          display: none;
        }
        .bar-wrap {
          gap: 0;
        }
        .ticker {
          font-size: 0.8rem;
        }
        .name {
          font-size: 0.66rem;
        }
        #portfolio-bar {
          bottom: 8px;
          padding: 10px 12px;
          gap: 10px;
        }
      }
    </style>
  </head>
  <body>
    <div class="site-tabs">
      <a class="brand" href="index.html"
        ><span class="brand-mark">TAIEX</span
        ><span class="brand-sub">台股觀測</span></a
      >
      <nav class="site-links">
        <a href="index.html" class="site-tab">漲跌排行</a>
        <a href="dca.html" class="site-tab active">定期定額</a>
        <a href="bear.html" class="site-tab">空頭市場</a>
      </nav>
      <button class="theme-toggle" id="theme-toggle" aria-label="切換深色／淺色主題"></button>
    </div>

    <header>
      <div>
        <div class="kicker">DCA Backtest</div>
        <h1>定期定額試算</h1>
      </div>
      <div class="meta">
        <span>資料更新 <b id="last-updated">載入中…</b></span>
      </div>
    </header>

    <div id="error-banner"></div>

    <div class="container">
      <div class="info-bar" id="info-bar">
        <span
          >每月 <b>5 日</b> 投入
          <b>3,000 元</b>・允許小數股・股息隔天再投入</span
        >
        <span class="period">回測期間：<b id="period-text">載入中…</b></span>
        <div class="period-btns">
          <button class="period-btn active" onclick="setPeriod('10y', this)">
            近10年
          </button>
          <button class="period-btn" onclick="setPeriod('5y', this)">
            近5年
          </button>
          <button
            class="period-btn crash"
            onclick="setPeriod('crash_10y', this)"
          >
            股災前10年
          </button>
          <button
            class="period-btn crash"
            onclick="setPeriod('crash_5y', this)"
          >
            股災前5年
          </button>
          <button class="period-btn" onclick="setPeriod('covid', this)">
            2020/02起
          </button>
        </div>
      </div>

      <div class="filter-bar" id="filter-bar"></div>

      <div class="col-toggle-bar" id="col-toggles">
        <span class="label">欄位：</span>
      </div>

      <div class="table-wrap">
        <div id="table-container">
          <div class="loading-msg">資料載入中，首次約需 60 秒…</div>
        </div>
      </div>

      <div class="section-head">
        <h2>大跌加碼 vs 固定扣款</h2>
        <p>
          台股加權指數單日跌幅 ≥ <b>5%</b> 時，隔一個交易日加碼
          <b>2 倍</b>月扣款金額，與固定扣款比較（固定「近 10
          年」情境，會套用上方篩選，但不隨期間按鈕變動）
        </p>
      </div>
      <div class="table-wrap">
        <div id="dip-compare-container">
          <div class="loading-msg">資料載入中…</div>
        </div>
      </div>
    </div>

    <script>
      function rateStr(r) {
        if (r == null) return "—";
        return (r >= 0 ? "+" : "") + r.toFixed(2) + "%";
      }
      function rateClass(r) {
        if (r == null) return "";
        return r >= 0 ? "pos" : "neg";
      }

      let _cache = {};
      let _results = [];
      let _dipCompare = [];
      let _sortKey = "irr";
      let _portfolio = new Set();
      let _visibleCols = new Set([
        "return_rate",
        "irr",
        "max_drawdown",
        "calmar",
      ]);
      let _filters = { market: null, type: null, special: new Set() };

      const FILTER_GROUPS = [
        {
          key: "market",
          label: "市場",
          chips: [
            { val: "tw", label: "台股" },
            { val: "us", label: "美股" },
          ],
        },
        {
          key: "type",
          label: "類型",
          chips: [
            { val: "stock", label: "個股" },
            { val: "etf", label: "ETF" },
          ],
        },
        {
          key: "special",
          label: "特殊",
          chips: [
            { val: "finance", label: "金融股" },
            { val: "shipping", label: "航運" },
            { val: "biotech", label: "生技" },
            { val: "leveraged", label: "槓桿ETF" },
            { val: "no_leverage", label: "無槓桿ETF" },
          ],
        },
      ];

      function matchesSpecial(tags, val) {
        if (val === "no_leverage")
          return tags.includes("etf") && !tags.includes("leveraged");
        return tags.includes(val);
      }

      function applyFilters(results) {
        return results.filter((d) => {
          const tags = d.tags || [];
          if (_filters.market && !tags.includes(_filters.market)) return false;
          if (_filters.type && !tags.includes(_filters.type)) return false;
          if (
            _filters.special.size > 0 &&
            ![..._filters.special].some((s) => matchesSpecial(tags, s))
          )
            return false;
          return true;
        });
      }

      function setFilter(groupKey, val) {
        if (groupKey === "special") {
          if (_filters.special.has(val)) _filters.special.delete(val);
          else _filters.special.add(val);
        } else {
          _filters[groupKey] = _filters[groupKey] === val ? null : val;
        }
        document.getElementById("filter-bar").innerHTML = renderFilterBar();
        document.getElementById("table-container").innerHTML = renderTable();
        document.getElementById("dip-compare-container").innerHTML =
          renderDipCompareTable();
      }

      function renderFilterBar() {
        return FILTER_GROUPS.map((g) => {
          const chips = g.chips
            .map((c) => {
              const isActive =
                g.key === "special"
                  ? _filters.special.has(c.val)
                  : _filters[g.key] === c.val;
              return `<button class="filter-chip ${isActive ? "active" : ""}" onclick="setFilter('${g.key}','${c.val}')">${c.label}</button>`;
            })
            .join("");
          return `<div class="filter-group"><span class="filter-label">${g.label}</span>${chips}</div>`;
        }).join("");
      }

      const COL_DEFS = [
        { key: "invested", label: "成本", sortable: true },
        { key: "shares", label: "股數", sortable: false },
        { key: "market_value", label: "市值", sortable: true },
        { key: "last_price", label: "收盤價", sortable: true },
        { key: "market_cap", label: "股票市值", sortable: true },
        { key: "pnl", label: "損益", sortable: true },
        { key: "return_rate", label: "總報酬", sortable: true },
        { key: "irr", label: "XIRR", sortable: true },
        { key: "max_drawdown", label: "最大回撤", sortable: true },
        { key: "calmar", label: "Calmar", sortable: true },
      ];

      function moneyStr(v) {
        if (v == null) return "—";
        return Math.round(v).toLocaleString();
      }
      function sharesStr(v) {
        if (v == null) return "—";
        return v.toFixed(2);
      }
      function mktCapStr(v) {
        if (v == null) return "—";
        if (v >= 1e12) return (v / 1e12).toFixed(2) + " 兆";
        if (v >= 1e8) return (v / 1e8).toFixed(2) + " 億";
        if (v >= 1e4) return (v / 1e4).toFixed(2) + " 萬";
        return Math.round(v).toLocaleString();
      }

      function pnlVal(d) {
        if (d.invested == null || d.reinvest.market_value == null) return null;
        return d.reinvest.market_value - d.invested;
      }
      function pnlStr(v) {
        if (v == null) return "—";
        return (v >= 0 ? "+" : "") + Math.round(v).toLocaleString();
      }

      function sortValue(d, key) {
        if (key === "invested") return d.invested ?? -Infinity;
        if (key === "market_value") return d.reinvest.market_value ?? -Infinity;
        if (key === "last_price") return d.last_price ?? -Infinity;
        if (key === "market_cap") return d.market_cap ?? -Infinity;
        if (key === "pnl") return pnlVal(d) ?? -Infinity;
        const v = d.reinvest[key];
        if (v == null) return -Infinity;
        return key === "max_drawdown" ? Math.abs(v) : v;
      }

      function renderToggles() {
        return (
          '<span class="label">欄位：</span>' +
          COL_DEFS.map(
            (c) =>
              `<button class="col-chip ${_visibleCols.has(c.key) ? "on" : ""}" onclick="toggleCol('${c.key}')">${c.label}</button>`,
          ).join("")
        );
      }

      function toggleCol(key) {
        if (_visibleCols.has(key)) _visibleCols.delete(key);
        else _visibleCols.add(key);
        document.getElementById("col-toggles").innerHTML = renderToggles();
        document.getElementById("table-container").innerHTML = renderTable();
      }

      function renderTable() {
        const filtered = applyFilters(_results);
        if (!filtered.length) {
          return _results.length
            ? '<div class="loading-msg">無符合篩選條件的資料</div>'
            : '<div class="loading-msg">資料尚未就緒，請稍後重新整理</div>';
        }

        const vis = (key) => _visibleCols.has(key);
        const sorted = [...filtered].sort(
          (a, b) => sortValue(b, _sortKey) - sortValue(a, _sortKey),
        );

        const maxIrr = Math.max(
          ...sorted.map((d) => Math.abs(d.reinvest.irr ?? 0)),
        );
        const maxDd = Math.max(
          ...sorted.map((d) => Math.abs(d.reinvest.max_drawdown ?? 0)),
        );
        const maxCalmar = Math.max(
          ...sorted.map((d) => d.reinvest.calmar ?? 0),
        );

        const rows = sorted
          .map((d, i) => {
            const re = d.reinvest;
            const irrBarW =
              maxIrr > 0
                ? Math.round((Math.abs(re.irr ?? 0) / maxIrr) * 60)
                : 0;
            const ddBarW =
              maxDd > 0
                ? Math.round((Math.abs(re.max_drawdown ?? 0) / maxDd) * 60)
                : 0;
            const calmarBarW =
              maxCalmar > 0
                ? Math.round(((re.calmar ?? 0) / maxCalmar) * 60)
                : 0;
            const calmarClass =
              re.calmar == null
                ? ""
                : re.calmar >= 1
                  ? "pos"
                  : re.calmar >= 0.5
                    ? "mid"
                    : "neg";
            const pnl = pnlVal(d);
            const sel = _portfolio.has(d.ticker);
            return `
            <tr class="${sel ? "selected" : ""}" onclick="togglePortfolio('${d.ticker}')">
              <td>${sel ? "✓" : i + 1}</td>
              <td><div class="ticker">${d.ticker}</div><div class="name">${d.name}</div></td>
              ${vis("invested") ? `<td>${moneyStr(d.invested)}</td>` : ""}
              ${vis("shares") ? `<td>${sharesStr(re.shares)}</td>` : ""}
              ${vis("market_value") ? `<td>${moneyStr(re.market_value)}</td>` : ""}
              ${vis("last_price") ? `<td>${d.last_price != null ? d.last_price.toLocaleString() : "—"}</td>` : ""}
              ${vis("market_cap") ? `<td>${mktCapStr(d.market_cap)}</td>` : ""}
              ${vis("pnl") ? `<td><span class="${rateClass(pnl)}">${pnlStr(pnl)}</span></td>` : ""}
              ${vis("return_rate") ? `<td><span class="${rateClass(re.return_rate)}">${rateStr(re.return_rate)}</span></td>` : ""}
              ${vis("irr") ? `<td><div class="bar-wrap"><span class="${rateClass(re.irr)}">${rateStr(re.irr)}</span><div class="bar" style="width:${irrBarW}px"></div></div></td>` : ""}
              ${vis("max_drawdown") ? `<td><div class="bar-wrap"><span class="neg">${re.max_drawdown != null ? re.max_drawdown.toFixed(2) + "%" : "—"}</span><div class="bar neg-bar" style="width:${ddBarW}px"></div></div></td>` : ""}
              ${vis("calmar") ? `<td><div class="bar-wrap"><span class="${calmarClass}">${re.calmar != null ? re.calmar.toFixed(2) : "—"}</span><div class="bar" style="width:${calmarBarW}px"></div></div></td>` : ""}
            </tr>`;
          })
          .join("");

        const arrow = "▼";
        function thClass(key) {
          return _sortKey === key ? "th-active" : "th-sort";
        }
        function thLabel(key, label) {
          return `<th class="${thClass(key)}" onclick="setSort('${key}')">${label} <span class="sort-arrow">${_sortKey === key ? arrow : "↕"}</span></th>`;
        }

        return `
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>標的</th>
                ${vis("invested") ? thLabel("invested", "成本") : ""}
                ${vis("shares") ? "<th>股數</th>" : ""}
                ${vis("market_value") ? thLabel("market_value", "市值") : ""}
                ${vis("last_price") ? thLabel("last_price", "收盤價") : ""}
                ${vis("market_cap") ? thLabel("market_cap", "股票市值") : ""}
                ${vis("pnl") ? thLabel("pnl", "損益") : ""}
                ${vis("return_rate") ? thLabel("return_rate", "總報酬") : ""}
                ${vis("irr") ? thLabel("irr", "XIRR") : ""}
                ${vis("max_drawdown") ? thLabel("max_drawdown", "最大回撤") : ""}
                ${vis("calmar") ? thLabel("calmar", "Calmar") : ""}
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>`;
      }

      function renderDipCompareTable() {
        const rows = applyFilters(_dipCompare);
        if (!rows.length) {
          return _dipCompare.length
            ? '<div class="loading-msg">無符合篩選條件的資料</div>'
            : '<div class="loading-msg">資料尚未就緒，請稍後重新整理</div>';
        }
        const withDelta = rows.map((d) => ({
          ...d,
          deltaIrr:
            d.baseline.irr != null && d.dip_buy.irr != null
              ? d.dip_buy.irr - d.baseline.irr
              : null,
        }));
        const sorted = [...withDelta].sort(
          (a, b) => (b.deltaIrr ?? -Infinity) - (a.deltaIrr ?? -Infinity),
        );
        const ddStr = (v) => (v != null ? v.toFixed(2) + "%" : "—");

        const rows_ = sorted
          .map((d, i) => {
            const b = d.baseline,
              dp = d.dip_buy;
            const deltaClass =
              d.deltaIrr == null ? "" : d.deltaIrr >= 0 ? "pos" : "neg";
            const deltaStr =
              d.deltaIrr != null
                ? (d.deltaIrr >= 0 ? "+" : "") + d.deltaIrr.toFixed(2) + "%"
                : "—";
            return `<tr>
              <td>${i + 1}</td>
              <td><div class="ticker">${d.ticker}</div><div class="name">${d.name}</div></td>
              <td>${d.dip_trigger_count}</td>
              <td>${moneyStr(b.invested)}</td>
              <td>${moneyStr(dp.invested)}</td>
              <td><span class="${rateClass(b.irr)}">${rateStr(b.irr)}</span></td>
              <td><span class="${rateClass(dp.irr)}">${rateStr(dp.irr)}</span></td>
              <td><span class="${deltaClass}">${deltaStr}</span></td>
              <td>${ddStr(b.max_drawdown)}</td>
              <td>${ddStr(dp.max_drawdown)}</td>
            </tr>`;
          })
          .join("");

        return `<table>
          <thead>
            <tr>
              <th>#</th>
              <th>標的</th>
              <th>加碼次數</th>
              <th>固定投入</th>
              <th>加碼投入</th>
              <th>固定 XIRR</th>
              <th>加碼 XIRR</th>
              <th>XIRR 差異</th>
              <th>固定回撤</th>
              <th>加碼回撤</th>
            </tr>
          </thead>
          <tbody>${rows_}</tbody>
        </table>`;
      }

      function setSort(key) {
        _sortKey = key;
        document.getElementById("table-container").innerHTML = renderTable();
      }

      function togglePortfolio(ticker) {
        if (_portfolio.has(ticker)) _portfolio.delete(ticker);
        else _portfolio.add(ticker);
        document.getElementById("table-container").innerHTML = renderTable();
        updatePortfolioBar();
      }

      function clearPortfolio() {
        _portfolio.clear();
        document.getElementById("table-container").innerHTML = renderTable();
        updatePortfolioBar();
      }

      function updatePortfolioBar() {
        const bar = document.getElementById("portfolio-bar");
        const selected = _results.filter((d) => _portfolio.has(d.ticker));
        if (!selected.length) {
          bar.classList.remove("visible");
          document.body.classList.remove("has-portfolio");
          return;
        }
        bar.classList.add("visible");
        document.body.classList.add("has-portfolio");

        document.getElementById("portfolio-chips").innerHTML = selected
          .map(
            (d) =>
              `<span class="portfolio-chip" onclick="event.stopPropagation();togglePortfolio('${d.ticker}')" title="點擊移除">${d.ticker} ${d.name} ✕</span>`,
          )
          .join("");

        if (selected.length >= 2) {
          const totalInvested = selected.reduce(
            (s, d) => s + (d.invested ?? 0),
            0,
          );
          const totalMV = selected.reduce(
            (s, d) => s + (d.reinvest.market_value ?? 0),
            0,
          );
          const combinedReturn =
            totalInvested > 0
              ? ((totalMV - totalInvested) / totalInvested) * 100
              : null;
          const pnl = totalMV - totalInvested;
          const retClass =
            combinedReturn == null ? "" : combinedReturn >= 0 ? "pos" : "neg";
          const pnlClass = pnl >= 0 ? "pos" : "neg";
          document.getElementById("portfolio-stats").innerHTML = `
            <div class="portfolio-stat">
              <span class="s-label">總投入</span>
              <span class="s-val">${Math.round(totalInvested).toLocaleString()}</span>
            </div>
            <div class="portfolio-stat">
              <span class="s-label">總市值</span>
              <span class="s-val">${Math.round(totalMV).toLocaleString()}</span>
            </div>
            <div class="portfolio-stat">
              <span class="s-label">損益</span>
              <span class="s-val ${pnlClass}">${pnl >= 0 ? "+" : ""}${Math.round(pnl).toLocaleString()}</span>
            </div>
            <div class="portfolio-stat">
              <span class="s-label">組合總報酬</span>
              <span class="s-val ${retClass}">${combinedReturn != null ? (combinedReturn >= 0 ? "+" : "") + combinedReturn.toFixed(2) + "%" : "—"}</span>
            </div>`;
        } else {
          document.getElementById("portfolio-stats").innerHTML =
            `<span class="portfolio-hint">再選一檔計算組合報酬</span>`;
        }
      }

      function setPeriod(key, btn) {
        _results = _cache["results_" + key] || [];
        document
          .querySelectorAll(".period-btn")
          .forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        const first = _results[0];
        if (first) {
          document.getElementById("period-text").textContent =
            `${first.start_date} ～ ${first.end_date}`;
        }
        document.getElementById("filter-bar").innerHTML = renderFilterBar();
        document.getElementById("table-container").innerHTML = renderTable();
        updatePortfolioBar();
      }

      async function load() {
        try {
          const res = await fetch("data/dca.json");
          const data = await res.json();
          const err = document.getElementById("error-banner");
          if (data.error) {
            err.style.display = "block";
            err.textContent = "資料更新失敗：" + data.error;
          } else {
            err.style.display = "none";
          }
          document.getElementById("last-updated").textContent =
            data.last_updated || "—";

          _cache = {
            results_10y: data.results_10y || [],
            results_5y: data.results_5y || [],
            results_crash_10y: data.results_crash_10y || [],
            results_crash_5y: data.results_crash_5y || [],
            results_covid: data.results_covid || [],
          };
          _results = _cache.results_10y;
          const first = _results[0];
          if (first) {
            document.getElementById("period-text").textContent =
              `${first.start_date} ～ ${first.end_date}`;
          }
          document.getElementById("filter-bar").innerHTML = renderFilterBar();
          document.getElementById("table-container").innerHTML = renderTable();
          _dipCompare = data.dip_buy_comparison || [];
          document.getElementById("dip-compare-container").innerHTML =
            renderDipCompareTable();
        } catch (e) {
          console.error(e);
        }
      }

      document.getElementById("col-toggles").innerHTML = renderToggles();
      load();
    </script>
    <div id="portfolio-bar">
      <span class="portfolio-label">組合</span>
      <div class="portfolio-chips" id="portfolio-chips"></div>
      <div class="portfolio-stats" id="portfolio-stats"></div>
      <button class="portfolio-clear" onclick="clearPortfolio()">清除</button>
    </div>
  </body>
</html>
