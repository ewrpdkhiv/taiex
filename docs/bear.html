<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TAIEX 空頭市場記錄</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <script src="vendor/echarts.min.js"></script>
    <link rel="stylesheet" href="theme.css" />
    <script src="theme.js"></script>
    <script src="kline-events.js"></script>
    <style>
      .page-notes {
        max-width: 1120px;
        margin: 0 auto;
        padding: 0 24px;
        font-size: 0.8rem;
        color: var(--ink-3);
        display: flex;
        gap: 8px 16px;
        flex-wrap: wrap;
        align-items: center;
      }
      .def-chip {
        display: inline-block;
        background: var(--warn-soft);
        color: var(--warn);
        border: 1px solid var(--warn-line);
        border-radius: 999px;
        padding: 2px 10px;
        font-size: 0.74rem;
        font-weight: 500;
      }

      #bear-toggle-bar {
        padding: 10px 18px;
        border-bottom: 1px solid var(--rule);
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
      }

      .container {
        max-width: 1120px;
        margin: 16px auto 40px;
        padding: 0 24px;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      .card-header h2 {
        flex: 1;
      }
      .placeholder {
        padding: 36px;
        text-align: center;
        color: var(--ink-3);
      }

      th {
        cursor: pointer;
        user-select: none;
      }
      th:first-child,
      th.left,
      td:first-child,
      td.left {
        text-align: left;
      }
      th:hover {
        color: var(--ink);
      }
      th.sorted-desc {
        color: var(--ink);
      }
      th.sorted-desc::after {
        content: " ▼";
        font-size: 0.62rem;
        color: var(--accent);
      }
      tbody tr {
        cursor: pointer;
      }
      td {
        vertical-align: middle;
      }
      tbody tr.active td {
        background: var(--accent-soft);
      }

      .date-cell {
        font-family: var(--font-mono);
        font-size: 0.8rem;
        color: var(--ink-2);
        white-space: nowrap;
      }
      .val-cell {
        font-family: var(--font-mono);
        font-size: 0.8rem;
        color: var(--ink-2);
      }
      .drop-pct {
        font-weight: 700;
        color: var(--down);
        font-family: var(--font-mono);
      }

      .bar-wrap {
        display: flex;
        align-items: center;
        gap: 8px;
        justify-content: flex-end;
      }
      .bar-bg {
        width: 72px;
        height: 5px;
        background: var(--down-soft);
        border-radius: 999px;
        overflow: hidden;
        flex-shrink: 0;
      }
      .bar-fill {
        height: 100%;
        background: var(--down);
        border-radius: 999px;
      }

      .recovery-days {
        color: var(--ink-2);
        font-size: 0.8rem;
        font-family: var(--font-mono);
      }
      .recovery-days.long {
        color: var(--warn);
        font-weight: 600;
      }
      .no-recovery {
        color: var(--ink-3);
        font-style: italic;
        font-size: 0.78rem;
      }
      .event-cell {
        color: var(--ink-3);
        font-size: 0.78rem;
        max-width: 240px;
        white-space: normal;
      }

      .hide-col-peak-val .col-peak-val,
      .hide-col-trough-date .col-trough-date,
      .hide-col-trough-val .col-trough-val,
      .hide-col-drop .col-drop,
      .hide-col-beardays .col-beardays,
      .hide-col-recdays .col-recdays,
      .hide-col-event .col-event {
        display: none;
      }

      #loading {
        text-align: center;
        padding: 60px 20px;
        color: var(--ink-3);
      }
      #error-msg {
        display: none;
        text-align: center;
        padding: 40px;
        color: var(--danger);
      }

      #chart-panel {
        display: none;
      }
      #chart-container {
        height: 620px;
      }

      /* 統計數字磚 */
      .stat-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 1px;
        background: var(--rule);
      }
      .stat-tile {
        background: var(--surface);
        padding: 16px 18px;
      }
      .stat-label {
        font-size: 0.74rem;
        color: var(--ink-3);
        margin-bottom: 6px;
        letter-spacing: 0.02em;
      }
      .stat-value {
        font-size: 1.5rem;
        font-weight: 700;
        font-family: var(--font-mono);
        color: var(--ink);
        line-height: 1.2;
      }
      .stat-value.drop-pct {
        color: var(--down);
      }
      .hist-wrap {
        padding: 16px 20px;
        border-top: 1px solid var(--rule);
      }
      .hist-title {
        font-size: 0.8rem;
        color: var(--ink-2);
        font-weight: 600;
        margin-bottom: 12px;
      }
      .hist-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 8px;
        font-size: 0.8rem;
      }
      .hist-row:last-child {
        margin-bottom: 0;
      }
      .hist-label {
        width: 90px;
        flex-shrink: 0;
        color: var(--ink-2);
      }
      .hist-bar-bg {
        width: 160px;
        height: 8px;
        background: var(--accent-soft);
        border-radius: 999px;
        overflow: hidden;
        flex-shrink: 0;
      }
      .hist-bar-fill {
        height: 100%;
        background: var(--accent);
        border-radius: 999px;
      }
      .hist-count {
        color: var(--ink-3);
        font-family: var(--font-mono);
        font-size: 0.76rem;
      }

      @media (max-width: 600px) {
        .page-notes {
          padding: 0 16px;
        }
        #bear-toggle-bar {
          padding: 10px 12px;
        }
        .container {
          margin: 12px auto 28px;
          padding: 0 8px;
        }
        th:first-child,
        td:first-child {
          position: sticky;
          left: 0;
          background: var(--surface);
          z-index: 1;
        }
        th:first-child {
          background: var(--surface-2);
        }
        .stat-grid {
          grid-template-columns: repeat(2, 1fr);
        }
        .stat-value {
          font-size: 1.2rem;
        }
        .hist-bar-bg {
          width: 100px;
        }
        #chart-container {
          height: 460px;
        }
      }
    </style>
  </head>
  <body>
    <div class="site-tabs">
      <a class="brand" href="index.html"
        ><span class="brand-mark">TAIEX</span
        ><span class="brand-sub">台股觀測</span></a
      >
      <nav class="site-links">
        <a href="index.html" class="site-tab">漲跌排行</a>
        <a href="dca.html" class="site-tab">定期定額</a>
        <a href="bear.html" class="site-tab active">空頭市場</a>
      </nav>
      <button class="theme-toggle" id="theme-toggle" aria-label="切換深色／淺色主題"></button>
    </div>

    <header>
      <div>
        <div class="kicker">Bear Markets</div>
        <h1>台股加權指數空頭市場記錄</h1>
      </div>
      <div class="meta">
        <span>資料更新 <b id="last-updated">載入中…</b></span>
      </div>
    </header>

    <div class="page-notes">
      <span class="def-chip">定義：盤中最低價自前波盤中最高價下跌 ≥ 20%</span>
      <span>空頭期間 = 高點→低點；回本天數 = 高點→盤中重新觸及高點（皆為日曆天）</span>
    </div>

    <div class="container">
      <!-- 距離熊市 -->
      <div class="card">
        <div class="card-header">
          <h2>距離熊市還有多少</h2>
          <span class="badge" id="distance-badge">—</span>
        </div>
        <div id="distance-body">
          <div class="placeholder">
            載入中…
          </div>
        </div>
      </div>

      <!-- 統計摘要 -->
      <div class="card">
        <div class="card-header">
          <h2>空頭市場統計摘要</h2>
          <span class="badge" id="summary-badge">—</span>
        </div>
        <div id="summary-body">
          <div class="placeholder">
            載入中…
          </div>
        </div>
      </div>

      <!-- 空頭列表 -->
      <div class="card">
        <div class="card-header">
          <h2>台股加權指數 歷史空頭市場</h2>
          <span class="badge" id="count-badge">—</span>
        </div>
        <div id="bear-toggle-bar">
          <span class="toggle-label">欄位：</span>
        </div>
        <div id="loading">資料載入中…</div>
        <div id="error-msg"></div>
        <div class="table-wrap" id="table-wrap" style="display: none">
          <table id="bear-table">
            <thead>
              <tr>
                <th class="left" data-col="idx">#</th>
                <th class="left" data-col="peak_date">高點日期</th>
                <th class="col-peak-val" data-col="peak_value">高點</th>
                <th class="left col-trough-date" data-col="trough_date">
                  低點日期
                </th>
                <th class="col-trough-val" data-col="trough_value">低點</th>
                <th class="col-drop" data-col="drop_pct">跌幅</th>
                <th class="col-beardays" data-col="bear_days">
                  空頭期間<br /><small>高點→低點</small>
                </th>
                <th class="col-recdays" data-col="recovery_days">
                  回本天數<br /><small>高點→站回高點</small>
                </th>
                <th class="left col-event" data-col="event">事件</th>
              </tr>
            </thead>
            <tbody id="bear-tbody"></tbody>
          </table>
        </div>
      </div>

      <!-- K 線圖面板（點擊列後出現） -->
      <div class="card" id="chart-panel">
        <div class="chart-panel-header">
          <span class="chart-info" id="chart-info">—</span>
          <div class="chart-legend">
            <div class="legend-dot down"></div>
            <span>空頭期間</span>
            <div class="legend-dot up"></div>
            <span>回升期間</span>
            <div class="legend-dot nested"></div>
            <span>回升中再空頭</span>
          </div>
          <button class="close-btn" onclick="closeChart()">✕ 關閉</button>
        </div>
        <div id="chart-loading" style="display: none">K 線載入中…</div>
        <div id="chart-container"></div>
      </div>
    </div>

    <script>
      /* ── 資料狀態 ── */
      let _data = [];
      let _sortCol = "peak_date";
      let _ohlc = null; // 快取 OHLC
      let _chart = null; // ECharts 實例
      let _activeRow = null;

      const MAX_DROP = 80;

      /* ── 格式化輔助 ── */
      function fmtNum(v) {
        if (v == null) return "—";
        return v.toLocaleString("zh-TW", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2,
        });
      }
      // 日曆天數，滿一年時加註「約 X 年 Y 天」
      function calendarDaysStr(days) {
        const years = Math.floor(days / 365),
          rem = days % 365;
        let s = days.toLocaleString() + " 天";
        if (years > 0)
          s += `（約 ${years} 年${rem > 0 ? " " + rem + " 天" : ""}）`;
        return s;
      }
      function recoveryStr(days, hasNested) {
        if (days == null) return '<span class="no-recovery">尚未回高</span>';
        return `<span class="recovery-days ${hasNested ? "long" : ""}">${calendarDaysStr(days)}</span>`;
      }

      /* ── 統計摘要 ── */
      const RECOVERY_BUCKETS = [
        { label: "< 3 個月", max: 90 },
        { label: "3–6 個月", max: 180 },
        { label: "6–12 個月", max: 365 },
        { label: "1–2 年", max: 730 },
        { label: "> 2 年", max: Infinity },
      ];

      function daysBetween(a, b) {
        return Math.round((new Date(b) - new Date(a)) / 86400000);
      }

      function computeSummary(bears) {
        if (!bears.length) return null;

        const drops = bears.map((b) => b.drop_pct);
        const avgDrop = drops.reduce((a, b) => a + b, 0) / drops.length;
        const maxDrop = Math.min(...drops);

        const durations = bears.map((b) =>
          daysBetween(b.peak_date, b.trough_date),
        );
        const avgDuration =
          durations.reduce((a, b) => a + b, 0) / durations.length;

        const recovered = bears.filter((b) => b.recovery_date);
        const recoveryDurations = recovered.map((b) =>
          daysBetween(b.trough_date, b.recovery_date),
        );
        const avgRecovery = recoveryDurations.length
          ? recoveryDurations.reduce((a, b) => a + b, 0) /
            recoveryDurations.length
          : null;
        const sortedRec = [...recoveryDurations].sort((a, b) => a - b);
        const medianRecovery = sortedRec.length
          ? sortedRec[Math.floor(sortedRec.length / 2)]
          : null;

        const hist = RECOVERY_BUCKETS.map((b) => ({
          label: b.label,
          count: 0,
        }));
        recoveryDurations.forEach((d) => {
          for (let i = 0; i < RECOVERY_BUCKETS.length; i++) {
            if (d <= RECOVERY_BUCKETS[i].max) {
              hist[i].count++;
              break;
            }
          }
        });

        return {
          count: bears.length,
          avgDrop,
          maxDrop,
          avgDuration,
          avgRecovery,
          medianRecovery,
          hist,
          notRecoveredCount: bears.length - recovered.length,
        };
      }

      /* ── 距離熊市 ── */
      function renderDistance(d) {
        const badge = document.getElementById("distance-badge");
        const body = document.getElementById("distance-body");
        if (!d) {
          badge.textContent = "—";
          body.innerHTML =
            '<div class="placeholder">暫無資料</div>';
          return;
        }

        badge.textContent = d.is_bear_market
          ? "🐻 已進入熊市"
          : `距門檻 ${d.pct_to_bear.toFixed(2)}%`;

        body.innerHTML = `
          <div class="stat-grid">
            <div class="stat-tile">
              <div class="stat-label">最新盤中最低（${d.as_of_date}）</div>
              <div class="stat-value">${fmtNum(d.current_low ?? d.current_close)}</div>
            </div>
            <div class="stat-tile">
              <div class="stat-label">歷史盤中高點（${d.peak_date}）</div>
              <div class="stat-value">${fmtNum(d.peak_value)}</div>
            </div>
            <div class="stat-tile">
              <div class="stat-label">目前拉回幅度</div>
              <div class="stat-value drop-pct">${d.current_drawdown_pct.toFixed(2)}%</div>
            </div>
            <div class="stat-tile">
              <div class="stat-label">熊市門檻（${d.bear_threshold_pct.toFixed(0)}%）</div>
              <div class="stat-value">${fmtNum(d.bear_threshold_value)}</div>
            </div>
            <div class="stat-tile">
              <div class="stat-label">距門檻還差點數</div>
              <div class="stat-value">${d.is_bear_market ? "已跌破" : fmtNum(d.points_to_bear) + " 點"}</div>
            </div>
            <div class="stat-tile">
              <div class="stat-label">距門檻還差百分比</div>
              <div class="stat-value">${d.is_bear_market ? "已跌破" : d.pct_to_bear.toFixed(2) + "%"}</div>
            </div>
          </div>
        `;
      }

      function renderSummary(bears) {
        const s = computeSummary(bears);
        const body = document.getElementById("summary-body");
        document.getElementById("summary-badge").textContent = s
          ? s.count + " 次"
          : "—";
        if (!s) {
          body.innerHTML =
            '<div class="placeholder">暫無資料</div>';
          return;
        }

        const maxHistCount = Math.max(...s.hist.map((h) => h.count), 1);
        const histHtml = s.hist
          .map((h) => {
            const w = ((h.count / maxHistCount) * 100).toFixed(1);
            return `<div class="hist-row">
              <span class="hist-label">${h.label}</span>
              <div class="hist-bar-bg"><div class="hist-bar-fill" style="width:${w}%"></div></div>
              <span class="hist-count">${h.count} 次</span>
            </div>`;
          })
          .join("");

        body.innerHTML = `
          <div class="stat-grid">
            <div class="stat-tile">
              <div class="stat-label">空頭次數</div>
              <div class="stat-value">${s.count}</div>
            </div>
            <div class="stat-tile">
              <div class="stat-label">平均跌幅</div>
              <div class="stat-value drop-pct">${s.avgDrop.toFixed(2)}%</div>
            </div>
            <div class="stat-tile">
              <div class="stat-label">最大跌幅</div>
              <div class="stat-value drop-pct">${s.maxDrop.toFixed(2)}%</div>
            </div>
            <div class="stat-tile">
              <div class="stat-label">平均空頭期間（高點→低點）</div>
              <div class="stat-value">${Math.round(s.avgDuration)} 天</div>
            </div>
            <div class="stat-tile">
              <div class="stat-label">平均恢復天數（低點→回高）</div>
              <div class="stat-value">${s.avgRecovery != null ? Math.round(s.avgRecovery) + " 天" : "—"}</div>
            </div>
            <div class="stat-tile">
              <div class="stat-label">中位數恢復天數</div>
              <div class="stat-value">${s.medianRecovery != null ? s.medianRecovery + " 天" : "—"}</div>
            </div>
          </div>
          <div class="hist-wrap">
            <div class="hist-title">低點恢復時間分布${s.notRecoveredCount ? `（另有 ${s.notRecoveredCount} 次尚未恢復，不計入分布）` : ""}</div>
            ${histHtml}
          </div>
        `;
      }

      /* ── 表格渲染 ── */
      function renderTable() {
        const sorted = [..._data].sort((a, b) => {
          let av = a[_sortCol],
            bv = b[_sortCol];
          if (_sortCol === "idx") {
            av = _data.indexOf(a);
            bv = _data.indexOf(b);
          }
          if (av == null && bv == null) return 0;
          if (av == null) return 1;
          if (bv == null) return -1;
          if (typeof av === "string") return bv.localeCompare(av);
          return bv - av;
        });

        document.getElementById("bear-tbody").innerHTML = sorted
          .map((r, i) => {
            const barW = Math.min(
              (Math.abs(r.drop_pct) / MAX_DROP) * 100,
              100,
            ).toFixed(1);
            return `<tr data-bear='${JSON.stringify(r)}'>
            <td class="left val-cell">${i + 1}</td>
            <td class="left date-cell">${r.peak_date}</td>
            <td class="val-cell col-peak-val">${fmtNum(r.peak_value)}</td>
            <td class="left date-cell col-trough-date">${r.trough_date}</td>
            <td class="val-cell col-trough-val">${fmtNum(r.trough_value)}</td>
            <td class="col-drop">
              <div class="bar-wrap">
                <span class="drop-pct">${r.drop_pct.toFixed(2)}%</span>
                <div class="bar-bg"><div class="bar-fill" style="width:${barW}%"></div></div>
              </div>
            </td>
            <td class="col-beardays">${calendarDaysStr(r.bear_days ?? daysBetween(r.peak_date, r.trough_date))}</td>
            <td class="col-recdays">${recoveryStr(
              r.recovery_days,
              _data.some(
                (o) =>
                  o.peak_date !== r.peak_date &&
                  r.recovery_date &&
                  o.peak_date > r.trough_date &&
                  o.peak_date < r.recovery_date,
              ),
            )}</td>
            <td class="left event-cell col-event">${r.event || ""}</td>
          </tr>`;
          })
          .join("");

        /* 欄標題 */
        document.querySelectorAll("#bear-table th").forEach((th) => {
          th.classList.remove("sorted-desc");
          if (th.dataset.col === _sortCol) th.classList.add("sorted-desc");
        });

        /* 列點擊 → 開圖 */
        document.querySelectorAll("#bear-tbody tr").forEach((tr) => {
          tr.addEventListener("click", () => {
            const bear = JSON.parse(tr.dataset.bear);
            if (_activeRow) _activeRow.classList.remove("active");
            _activeRow = tr;
            tr.classList.add("active");
            openChart(bear);
          });
        });
      }

      document.querySelectorAll("#bear-table th").forEach((th) => {
        th.addEventListener("click", () => {
          _sortCol = th.dataset.col;
          renderTable();
        });
      });

      /* ── K 線：載入 OHLC ── */
      function offsetsToISODates(epochStr, offsets) {
        const epoch = Date.UTC(
          ...epochStr.split("-").map((v, i) => (i === 1 ? +v - 1 : +v)),
        );
        const DAY_MS = 86400000;
        return offsets.map((o) =>
          new Date(epoch + o * DAY_MS).toISOString().slice(0, 10),
        );
      }

      async function loadOhlc() {
        if (_ohlc) return _ohlc;
        const resp = await fetch("data/ohlc.json");
        const data = await resp.json();
        if (data.error) throw new Error(data.error);
        if (data.date_epoch && typeof data.dates[0] === "number") {
          data.dates = offsetsToISODates(data.date_epoch, data.dates);
        }
        _ohlc = data;
        return _ohlc;
      }

      /* ── K 線：開啟面板 ── */
      function openChart(bear) {
        const panel = document.getElementById("chart-panel");
        panel.style.display = "block";

        document.getElementById("chart-info").textContent =
          `${bear.peak_date} 高點 ${fmtNum(bear.peak_value)}　→　` +
          `${bear.trough_date} 低點 ${fmtNum(bear.trough_value)}　跌幅 ${bear.drop_pct.toFixed(2)}%` +
          (bear.event ? `　｜${bear.event}` : "");

        const loading = document.getElementById("chart-loading");
        loading.style.display = "block";
        document.getElementById("chart-container").style.display = "none";

        loadOhlc()
          .then((ohlc) => {
            loading.style.display = "none";
            document.getElementById("chart-container").style.display = "block";
            renderChart(bear, ohlc);
            panel.scrollIntoView({ behavior: "smooth", block: "nearest" });
          })
          .catch((err) => {
            loading.textContent = "K 線載入失敗：" + err.message;
          });
      }

      /* ── K 線：關閉面板 ── */
      function closeChart() {
        document.getElementById("chart-panel").style.display = "none";
        if (_activeRow) {
          _activeRow.classList.remove("active");
          _activeRow = null;
        }
      }

      /* ── K 線：渲染 ECharts ── */
      let _lastChartArgs = null;
      window.addEventListener("themechange", () => {
        if (_chart && _lastChartArgs) renderChart(..._lastChartArgs);
      });

      function renderChart(bear, ohlc) {
        _lastChartArgs = [bear, ohlc];
        const T = chartTheme();
        const dates = ohlc.dates;
        const O = ohlc.open,
          H = ohlc.high,
          L = ohlc.low,
          C = ohlc.close;
        const vixRaw = ohlc.vix || [];

        /* ECharts 格式：[open, close, low, high] */
        const candleData = dates.map((_, i) => [O[i], C[i], L[i], H[i]]);
        /* VIX：null 留空（ECharts 顯示斷點） */
        const vixData = dates.map((_, i) => vixRaw[i] ?? null);

        /* 計算初始縮放範圍（高點前 3 月 ~ 回高後 3 月） */
        const peakIdx = dates.indexOf(bear.peak_date);
        const troughIdx = dates.indexOf(bear.trough_date);
        const recIdx = bear.recovery_date
          ? dates.indexOf(bear.recovery_date)
          : -1;
        const bufPre = 60; // ~3 個月交易日
        const bufPost = 60;
        const startI = Math.max(0, peakIdx - bufPre);
        const endI =
          recIdx >= 0
            ? Math.min(dates.length - 1, recIdx + bufPost)
            : Math.min(dates.length - 1, troughIdx + 250);
        const zoomS = (startI / dates.length) * 100;
        const zoomE = (endI / dates.length) * 100;

        /* markArea：空頭紅 / 回升綠 */
        const markData = [
          [
            {
              xAxis: bear.peak_date,
              itemStyle: { color: T.downSoft },
            },
            { xAxis: bear.trough_date },
          ],
        ];
        if (bear.recovery_date) {
          markData.push([
            {
              xAxis: bear.trough_date,
              itemStyle: { color: T.upSoft },
            },
            { xAxis: bear.recovery_date },
          ]);
        }

        /* 回升期間內的巢狀空頭：橘色標示 + 箭頭說明 */
        const nestedMarkLineData = [];
        if (bear.recovery_date) {
          for (const other of _data) {
            if (other.peak_date === bear.peak_date) continue;
            if (
              other.peak_date > bear.trough_date &&
              other.peak_date < bear.recovery_date
            ) {
              markData.push([
                {
                  xAxis: other.peak_date,
                  itemStyle: { color: T.nestedSoft },
                },
                { xAxis: other.trough_date },
              ]);
              const pidx = dates.indexOf(other.peak_date);
              const tidx = dates.indexOf(other.trough_date);
              if (pidx >= 0 && tidx >= 0) {
                const midDate = dates[Math.floor((pidx + tidx) / 2)];
                nestedMarkLineData.push({
                  xAxis: midDate,
                  name: other.event || other.peak_date.slice(0, 7),
                });
              }
            }
          }
        }


        const option = {
          animation: false,
          backgroundColor: T.bg,
          axisPointer: { link: [{ xAxisIndex: "all" }] },
          grid: [
            { left: "7%", right: "3%", top: "6%", bottom: "42%" },
            { left: "7%", right: "3%", top: "66%", bottom: "12%" },
          ],
          xAxis: [
            {
              type: "category",
              data: dates,
              boundaryGap: true,
              gridIndex: 0,
              axisLabel: { show: false },
              axisLine: { lineStyle: { color: T.rule } },
              axisTick: { show: false },
            },
            {
              type: "category",
              data: dates,
              boundaryGap: true,
              gridIndex: 1,
              axisLabel: {
                formatter: (v) => v.slice(0, 7),
                fontSize: 10,
                rotate: 30,
                color: T.ink3,
              },
              axisLine: { lineStyle: { color: T.rule } },
              axisTick: { lineStyle: { color: T.rule } },
            },
          ],
          yAxis: [
            {
              type: "value",
              scale: true,
              gridIndex: 0,
              splitLine: { lineStyle: { color: T.rule } },
              axisLabel: {
                formatter: (v) => v.toLocaleString(),
                fontSize: 11,
                color: T.ink3,
              },
            },
            {
              type: "value",
              scale: true,
              gridIndex: 1,
              splitLine: { lineStyle: { color: T.grid } },
              axisLabel: { fontSize: 10, color: T.ink3 },
              name: "VIX",
              nameTextStyle: { color: T.warn, fontSize: 10 },
            },
          ],
          series: [
            {
              type: "candlestick",
              data: candleData,
              xAxisIndex: 0,
              yAxisIndex: 0,
              itemStyle: {
                color: T.candleUp,
                color0: T.candleDown,
                borderColor: T.candleUp,
                borderColor0: T.candleDown,
                borderWidth: 1,
              },
              markArea: { silent: true, data: markData },
            },
            ...(nestedMarkLineData.length > 0
              ? [
                  {
                    type: "line",
                    data: [],
                    xAxisIndex: 0,
                    yAxisIndex: 0,
                    markLine: {
                      silent: true,
                      symbol: ["none", "arrow"],
                      symbolSize: 8,
                      lineStyle: {
                        color: T.nested,
                        width: 1.5,
                        type: "dashed",
                      },
                      label: {
                        show: true,
                        position: "start",
                        formatter: (p) => p.name,
                        color: T.nestedLabel,
                        fontSize: 12,
                        fontWeight: 600,
                        backgroundColor: T.nestedLabelBg,
                        padding: [3, 8],
                        borderRadius: 4,
                        borderColor: T.nested,
                        borderWidth: 1,
                      },
                      data: nestedMarkLineData,
                    },
                  },
                ]
              : []),
            {
              type: "line",
              name: "VIX",
              data: vixData,
              xAxisIndex: 1,
              yAxisIndex: 1,
              symbol: "none",
              lineStyle: { color: T.warn, width: 1.5 },
              areaStyle: { color: T.warnSoft },
              connectNulls: false,
              markLine: {
                silent: true,
                symbol: "none",
                lineStyle: {
                  color: T.warn,
                  type: "dashed",
                  width: 1,
                  opacity: 0.4,
                },
                label: { fontSize: 11, color: T.warn, position: "end" },
                data: [
                  { yAxis: 30, name: "30" },
                  { yAxis: 40, name: "40" },
                ],
              },
            },
          ],
          tooltip: {
            trigger: "axis",
            axisPointer: { type: "cross", crossStyle: { color: T.ink3 } },
            backgroundColor: T.bg,
            borderColor: T.rule,
            textStyle: { color: T.ink, fontSize: 13 },
            position(point, params, dom, rect, size) {
              const [px] = point;
              const [cw, ch] = size.viewSize;
              const dw = dom.offsetWidth || 100;
              const x = px + dw + 16 > cw ? px - dw - 8 : px + 12;
              return [x, ch * 0.08];
            },
            formatter(params) {
              const p = params.find((x) => x.seriesType === "candlestick");
              const v = params.find((x) => x.seriesName === "VIX");
              if (!p) return "";
              const [o, c] = p.value;
              const cc = c >= o ? T.candleUp : T.candleDown;
              const vStr =
                v?.value != null
                  ? `<br/><span style="color:${T.warn}">VIX ${v.value.toFixed(1)}</span>`
                  : "";
              const ev = (ohlc.events || {})[p.name];
              const evStr = ev
                ? `<br/><span style="color:${T.event};font-weight:600">${ev}</span>`
                : "";
              return `<span style="color:${T.ink3};font-size:12px">${p.name}</span><br/><span style="color:${cc}">${c.toFixed(2)}</span>${vStr}${evStr}`;
            },
          },
          dataZoom: [
            { type: "inside", xAxisIndex: [0, 1], start: zoomS, end: zoomE },
            {
              type: "slider",
              xAxisIndex: [0, 1],
              bottom: "3%",
              height: 20,
              start: zoomS,
              end: zoomE,
              borderColor: T.rule,
              fillerColor: T.accentSoft,
              handleStyle: { color: T.accent },
              textStyle: { fontSize: 10, color: T.ink3 },
            },
          ],
        };

        // 事件帶（K 線與 VIX 之間，見 kline-events.js）；會調整 grid 版面
        const eventItems = addEventBand(
          option,
          T,
          ohlc,
          C,
          null,
          document.getElementById("chart-container").clientHeight,
        );

        if (!_chart) {
          _chart = echarts.init(document.getElementById("chart-container"));
          window.addEventListener("resize", () => _chart.resize());
        }
        _chart.setOption(option, true);
        _chart.resize();
        layoutEventLabels(_chart, eventItems);
      }

      /* ── 欄位 toggle ── */
      (function initBearToggles() {
        const COLS = [
          { cls: "col-peak-val", label: "高點", on: false },
          { cls: "col-trough-date", label: "低點日期", on: false },
          { cls: "col-trough-val", label: "低點", on: false },
          { cls: "col-drop", label: "跌幅", on: true },
          { cls: "col-beardays", label: "空頭期間", on: true },
          { cls: "col-recdays", label: "回本天數", on: true },
          { cls: "col-event", label: "事件", on: false },
        ];
        const bar = document.getElementById("bear-toggle-bar");
        COLS.forEach((t) => {
          if (!t.on) document.body.classList.add("hide-" + t.cls);
          const btn = document.createElement("button");
          btn.className = "col-chip" + (t.on ? " on" : "");
          btn.textContent = t.label;
          btn.addEventListener("click", () => {
            const nowOn = btn.classList.toggle("on");
            document.body.classList.toggle("hide-" + t.cls, !nowOn);
          });
          bar.appendChild(btn);
        });
      })();

      /* ── 初始資料載入 ── */
      function loadBear() {
        fetch("data/bear.json")
          .then((r) => r.json())
          .then((data) => {
            document.getElementById("loading").style.display = "none";
            if (data.error) {
              const el = document.getElementById("error-msg");
              el.textContent = "載入失敗：" + data.error;
              el.style.display = "block";
              return;
            }
            document.getElementById("last-updated").textContent =
              data.last_updated || "—";
            _data = data.bears || [];
            document.getElementById("count-badge").textContent =
              _data.length + " 次";
            document.getElementById("table-wrap").style.display = "block";
            renderTable();
            renderSummary(_data);
            renderDistance(data.distance_to_bear);
          })
          .catch((err) => {
            document.getElementById("loading").style.display = "none";
            const el = document.getElementById("error-msg");
            el.textContent = "網路錯誤：" + err;
            el.style.display = "block";
          });
      }
      loadBear();
    </script>
  </body>
</html>
