<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TAIEX 空頭市場記錄</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="theme.css" />
    <script>
      // 首次繪製前套用主題，避免閃爍；切換按鈕等其餘邏輯在 src/theme.ts
      (function () {
        var t = null;
        try {
          t = localStorage.getItem("taiex-theme");
        } catch (e) {}
        var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.setAttribute("data-theme", t || (dark ? "dark" : "light"));
      })();
    </script>
    <script type="module" src="./src/bear.ts"></script>
    <style>
      .page-notes {
        max-width: 1120px;
        margin: 0 auto;
        padding: 0 24px;
        font-size: 0.8rem;
        color: var(--ink-3);
        display: flex;
        gap: 8px 16px;
        flex-wrap: wrap;
        align-items: center;
      }
      .def-chip {
        display: inline-block;
        background: var(--warn-soft);
        color: var(--warn);
        border: 1px solid var(--warn-line);
        border-radius: 999px;
        padding: 2px 10px;
        font-size: 0.74rem;
        font-weight: 500;
      }

      #bear-toggle-bar {
        padding: 10px 18px;
        border-bottom: 1px solid var(--rule);
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
      }

      .container {
        max-width: 1120px;
        margin: 16px auto 40px;
        padding: 0 24px;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      .card-header h2 {
        flex: 1;
      }
      .placeholder {
        padding: 36px;
        text-align: center;
        color: var(--ink-3);
      }

      th {
        cursor: pointer;
        user-select: none;
      }
      th:first-child,
      th.left,
      td:first-child,
      td.left {
        text-align: left;
      }
      th:hover {
        color: var(--ink);
      }
      th.sorted-desc {
        color: var(--ink);
      }
      th.sorted-desc::after {
        content: " ▼";
        font-size: 0.62rem;
        color: var(--accent);
      }
      tbody tr {
        cursor: pointer;
      }
      td {
        vertical-align: middle;
      }
      tbody tr.active td {
        background: var(--accent-soft);
      }

      .date-cell {
        font-family: var(--font-mono);
        font-size: 0.8rem;
        color: var(--ink-2);
        white-space: nowrap;
      }
      .val-cell {
        font-family: var(--font-mono);
        font-size: 0.8rem;
        color: var(--ink-2);
      }
      .drop-pct {
        font-weight: 700;
        color: var(--down);
        font-family: var(--font-mono);
      }

      .bar-wrap {
        display: flex;
        align-items: center;
        gap: 8px;
        justify-content: flex-end;
      }
      .bar-bg {
        width: 72px;
        height: 5px;
        background: var(--down-soft);
        border-radius: 999px;
        overflow: hidden;
        flex-shrink: 0;
      }
      .bar-fill {
        height: 100%;
        background: var(--down);
        border-radius: 999px;
      }

      .recovery-days {
        color: var(--ink-2);
        font-size: 0.8rem;
        font-family: var(--font-mono);
      }
      .recovery-days.long {
        color: var(--warn);
        font-weight: 600;
      }
      .no-recovery {
        color: var(--ink-3);
        font-style: italic;
        font-size: 0.78rem;
      }
      .event-cell {
        color: var(--ink-3);
        font-size: 0.78rem;
        max-width: 240px;
        white-space: normal;
      }

      .hide-col-peak-val .col-peak-val,
      .hide-col-trough-date .col-trough-date,
      .hide-col-trough-val .col-trough-val,
      .hide-col-drop .col-drop,
      .hide-col-beardays .col-beardays,
      .hide-col-recdays .col-recdays,
      .hide-col-event .col-event {
        display: none;
      }

      #loading {
        text-align: center;
        padding: 60px 20px;
        color: var(--ink-3);
      }
      #error-msg {
        display: none;
        text-align: center;
        padding: 40px;
        color: var(--danger);
      }

      #chart-panel {
        display: none;
      }
      #chart-container {
        height: 620px;
      }

      /* 統計數字磚 */
      .stat-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 1px;
        background: var(--rule);
      }
      .stat-tile {
        background: var(--surface);
        padding: 16px 18px;
      }
      .stat-label {
        font-size: 0.74rem;
        color: var(--ink-3);
        margin-bottom: 6px;
        letter-spacing: 0.02em;
      }
      .stat-value {
        font-size: 1.5rem;
        font-weight: 700;
        font-family: var(--font-mono);
        color: var(--ink);
        line-height: 1.2;
      }
      .stat-value.drop-pct {
        color: var(--down);
      }
      .hist-wrap {
        padding: 16px 20px;
        border-top: 1px solid var(--rule);
      }
      .hist-title {
        font-size: 0.8rem;
        color: var(--ink-2);
        font-weight: 600;
        margin-bottom: 12px;
      }
      .hist-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 8px;
        font-size: 0.8rem;
      }
      .hist-row:last-child {
        margin-bottom: 0;
      }
      .hist-label {
        width: 90px;
        flex-shrink: 0;
        color: var(--ink-2);
      }
      .hist-bar-bg {
        width: 160px;
        height: 8px;
        background: var(--accent-soft);
        border-radius: 999px;
        overflow: hidden;
        flex-shrink: 0;
      }
      .hist-bar-fill {
        height: 100%;
        background: var(--accent);
        border-radius: 999px;
      }
      .hist-count {
        color: var(--ink-3);
        font-family: var(--font-mono);
        font-size: 0.76rem;
      }

      @media (max-width: 600px) {
        .page-notes {
          padding: 0 16px;
        }
        #bear-toggle-bar {
          padding: 10px 12px;
        }
        .container {
          margin: 12px auto 28px;
          padding: 0 8px;
        }
        th:first-child,
        td:first-child {
          position: sticky;
          left: 0;
          background: var(--surface);
          z-index: 1;
        }
        th:first-child {
          background: var(--surface-2);
        }
        .stat-grid {
          grid-template-columns: repeat(2, 1fr);
        }
        .stat-value {
          font-size: 1.2rem;
        }
        .hist-bar-bg {
          width: 100px;
        }
        #chart-container {
          height: 460px;
        }
      }
    </style>
  </head>
  <body>
    <div class="site-tabs">
      <a class="brand" href="index.html"
        ><span class="brand-mark">TAIEX</span
        ><span class="brand-sub">台股觀測</span></a
      >
      <nav class="site-links">
        <a href="index.html" class="site-tab">漲跌排行</a>
        <a href="dca.html" class="site-tab">定期定額</a>
        <a href="bear.html" class="site-tab active">空頭市場</a>
      </nav>
      <button class="theme-toggle" id="theme-toggle" aria-label="切換深色／淺色主題"></button>
    </div>

    <header>
      <div>
        <div class="kicker">Bear Markets</div>
        <h1>台股加權指數空頭市場記錄</h1>
      </div>
      <div class="meta">
        <span>資料更新 <b id="last-updated">載入中…</b></span>
      </div>
    </header>

    <div class="page-notes">
      <span class="def-chip">定義：盤中最低價自前波盤中最高價下跌 ≥ 20%</span>
      <span>空頭期間 = 高點→低點；回本天數 = 高點→盤中重新觸及高點（皆為日曆天）</span>
    </div>

    <div class="container">
      <!-- 距離熊市 -->
      <div class="card">
        <div class="card-header">
          <h2>距離熊市還有多少</h2>
          <span class="badge" id="distance-badge">—</span>
        </div>
        <div id="distance-body">
          <div class="placeholder">
            載入中…
          </div>
        </div>
      </div>

      <!-- 統計摘要 -->
      <div class="card">
        <div class="card-header">
          <h2>空頭市場統計摘要</h2>
          <span class="badge" id="summary-badge">—</span>
        </div>
        <div id="summary-body">
          <div class="placeholder">
            載入中…
          </div>
        </div>
      </div>

      <!-- 空頭列表 -->
      <div class="card">
        <div class="card-header">
          <h2>台股加權指數 歷史空頭市場</h2>
          <span class="badge" id="count-badge">—</span>
        </div>
        <div id="bear-toggle-bar">
          <span class="toggle-label">欄位：</span>
        </div>
        <div id="loading">資料載入中…</div>
        <div id="error-msg"></div>
        <div class="table-wrap" id="table-wrap" style="display: none">
          <table id="bear-table">
            <thead>
              <tr>
                <th class="left" data-col="idx">#</th>
                <th class="left" data-col="peak_date">高點日期</th>
                <th class="col-peak-val" data-col="peak_value">高點</th>
                <th class="left col-trough-date" data-col="trough_date">
                  低點日期
                </th>
                <th class="col-trough-val" data-col="trough_value">低點</th>
                <th class="col-drop" data-col="drop_pct">跌幅</th>
                <th class="col-beardays" data-col="bear_days">
                  空頭期間<br /><small>高點→低點</small>
                </th>
                <th class="col-recdays" data-col="recovery_days">
                  回本天數<br /><small>高點→站回高點</small>
                </th>
                <th class="left col-event" data-col="event">事件</th>
              </tr>
            </thead>
            <tbody id="bear-tbody"></tbody>
          </table>
        </div>
      </div>

      <!-- K 線圖面板（點擊列後出現） -->
      <div class="card" id="chart-panel">
        <div class="chart-panel-header">
          <span class="chart-info" id="chart-info">—</span>
          <div class="chart-legend">
            <div class="legend-dot down"></div>
            <span>空頭期間</span>
            <div class="legend-dot up"></div>
            <span>回升期間</span>
            <div class="legend-dot nested"></div>
            <span>回升中再空頭</span>
          </div>
          <button class="close-btn" onclick="closeChart()">✕ 關閉</button>
        </div>
        <div id="chart-loading" style="display: none">K 線載入中…</div>
        <div id="chart-container"></div>
      </div>
    </div>

  </body>
</html>
