<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TAIEX 空頭市場記錄</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC",
          sans-serif;
        background: #f0f2f5;
        color: #333;
      }

      header {
        background: #1a1a2e;
        color: #fff;
        padding: 16px 20px;
        display: flex;
        align-items: baseline;
        gap: 16px;
        flex-wrap: wrap;
      }
      header h1 {
        font-size: 1.1rem;
        font-weight: 600;
        flex: 1;
      }
      header a.nav-link {
        font-size: 0.8rem;
        color: #94a3b8;
        text-decoration: none;
        border: 1px solid #334155;
        padding: 4px 10px;
        border-radius: 5px;
        white-space: nowrap;
      }
      header a.nav-link:hover {
        color: #e2e8f0;
        border-color: #475569;
      }

      .meta {
        padding: 10px 20px;
        font-size: 0.78rem;
        color: #64748b;
        background: #f8fafc;
        border-bottom: 1px solid #e2e8f0;
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
        align-items: center;
      }
      .meta b {
        color: #475569;
      }
      .def-chip {
        display: inline-block;
        background: #fef3c7;
        color: #92400e;
        border: 1px solid #fde68a;
        border-radius: 20px;
        padding: 2px 10px;
        font-size: 0.75rem;
      }

      .container {
        max-width: 1200px;
        margin: 24px auto;
        padding: 0 16px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .card {
        background: #fff;
        border-radius: 10px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
        overflow: hidden;
      }
      .card-header {
        background: linear-gradient(135deg, #7c3aed, #4f46e5);
        color: #fff;
        padding: 14px 20px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .card-header h2 {
        font-size: 0.95rem;
        font-weight: 600;
        flex: 1;
      }
      .badge {
        background: rgba(255, 255, 255, 0.2);
        border-radius: 20px;
        padding: 2px 10px;
        font-size: 0.75rem;
      }

      .table-wrap {
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.82rem;
      }
      th {
        background: #f8fafc;
        padding: 10px 12px;
        text-align: right;
        font-weight: 600;
        color: #475569;
        border-bottom: 2px solid #e2e8f0;
        white-space: nowrap;
        cursor: pointer;
        user-select: none;
      }
      th:first-child,
      th.left {
        text-align: left;
      }
      th:hover {
        background: #f1f5f9;
      }
      th.sorted-desc::after {
        content: " ▼";
        font-size: 0.7rem;
        color: #7c3aed;
      }

      tbody tr {
        cursor: pointer;
      }
      td {
        padding: 10px 12px;
        border-bottom: 1px solid #f1f5f9;
        text-align: right;
        vertical-align: middle;
      }
      td:first-child,
      td.left {
        text-align: left;
      }
      tr:last-child td {
        border-bottom: none;
      }
      tbody tr:hover td {
        background: #faf5ff;
      }
      tbody tr.active td {
        background: #ede9fe;
      }

      .date-cell {
        font-family: "SF Mono", "Fira Code", monospace;
        font-size: 0.8rem;
        color: #374151;
        white-space: nowrap;
      }
      .val-cell {
        font-family: "SF Mono", "Fira Code", monospace;
        font-size: 0.8rem;
        color: #374151;
      }
      .drop-pct {
        font-weight: 700;
        color: #dc2626;
      }

      .bar-wrap {
        display: flex;
        align-items: center;
        gap: 6px;
        justify-content: flex-end;
      }
      .bar-bg {
        width: 80px;
        height: 6px;
        background: #fee2e2;
        border-radius: 3px;
        overflow: hidden;
        flex-shrink: 0;
      }
      .bar-fill {
        height: 100%;
        background: #dc2626;
        border-radius: 3px;
      }

      .recovery-days {
        color: #374151;
        font-size: 0.8rem;
      }
      .recovery-days.long {
        color: #92400e;
      }
      .no-recovery {
        color: #94a3b8;
        font-style: italic;
        font-size: 0.78rem;
      }
      .event-cell {
        color: #475569;
        font-size: 0.78rem;
        max-width: 240px;
      }

      /* ── 欄位 toggle ── */
      .hide-col-peak-val .col-peak-val {
        display: none;
      }
      .hide-col-trough-date .col-trough-date {
        display: none;
      }
      .hide-col-trough-val .col-trough-val {
        display: none;
      }
      .hide-col-drop .col-drop {
        display: none;
      }
      .hide-col-recdays .col-recdays {
        display: none;
      }
      .hide-col-event .col-event {
        display: none;
      }

      #bear-toggle-bar {
        background: #f8fafc;
        border-bottom: 1px solid #e2e8f0;
        padding: 7px 16px;
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
      }
      #bear-toggle-bar .toggle-label {
        font-size: 0.74rem;
        color: #64748b;
        white-space: nowrap;
        margin-right: 2px;
      }
      .col-chip {
        padding: 3px 10px;
        font-size: 0.74rem;
        border-radius: 20px;
        border: 1px solid #cbd5e1;
        background: #f1f5f9;
        color: #64748b;
        cursor: pointer;
        transition: all 0.15s;
      }
      .col-chip:hover {
        border-color: #94a3b8;
        color: #334155;
      }
      .col-chip.on {
        background: #1e293b;
        border-color: #1e293b;
        color: #f1f5f9;
      }

      #loading {
        text-align: center;
        padding: 60px 20px;
        color: #64748b;
      }
      #error-msg {
        display: none;
        text-align: center;
        padding: 40px;
        color: #dc2626;
      }

      /* ── 圖表面板 ── */
      #chart-panel {
        display: none;
      }
      .chart-panel-header {
        background: #1e293b;
        color: #fff;
        padding: 12px 16px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .chart-panel-header .chart-info {
        flex: 1;
        font-size: 0.82rem;
        color: #cbd5e1;
      }
      .chart-legend {
        display: flex;
        gap: 14px;
        align-items: center;
        font-size: 0.75rem;
      }
      .legend-dot {
        width: 12px;
        height: 12px;
        border-radius: 2px;
        flex-shrink: 0;
      }
      .close-btn {
        background: none;
        border: 1px solid #475569;
        color: #94a3b8;
        border-radius: 5px;
        padding: 3px 10px;
        cursor: pointer;
        font-size: 0.78rem;
      }
      .close-btn:hover {
        color: #e2e8f0;
        border-color: #64748b;
      }
      #chart-loading {
        text-align: center;
        padding: 40px;
        color: #64748b;
      }
      #chart-container {
        height: 460px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>🐻 TAIEX 空頭市場記錄</h1>
      <a href="/" class="nav-link">漲跌排行 →</a>
      <a href="/dca" class="nav-link">定期定額試算 →</a>
    </header>

    <div class="meta">
      <span>更新：<b id="last-updated">載入中…</b></span>
      <span class="def-chip">定義：高點到低點跌幅 ≥ 20%</span>
      <span>回高天數 = 從高點起算至回到高點水準的日曆天</span>
    </div>

    <div id="bear-toggle-bar">
      <span class="toggle-label">欄位：</span>
    </div>

    <div class="container">
      <!-- 空頭列表 -->
      <div class="card">
        <div class="card-header">
          <h2>台股加權指數 歷史空頭市場</h2>
          <span class="badge" id="count-badge">—</span>
        </div>
        <div id="loading">資料載入中…</div>
        <div id="error-msg"></div>
        <div class="table-wrap" id="table-wrap" style="display: none">
          <table id="bear-table">
            <thead>
              <tr>
                <th class="left" data-col="idx">#</th>
                <th class="left" data-col="peak_date">高點日期</th>
                <th class="col-peak-val" data-col="peak_value">高點</th>
                <th class="left col-trough-date" data-col="trough_date">
                  低點日期
                </th>
                <th class="col-trough-val" data-col="trough_value">低點</th>
                <th class="col-drop" data-col="drop_pct">跌幅</th>
                <th class="col-recdays" data-col="recovery_days">回高天數</th>
                <th class="left col-event" data-col="event">事件</th>
              </tr>
            </thead>
            <tbody id="bear-tbody"></tbody>
          </table>
        </div>
      </div>

      <!-- K 線圖面板（點擊列後出現） -->
      <div class="card" id="chart-panel">
        <div class="chart-panel-header">
          <span class="chart-info" id="chart-info">—</span>
          <div class="chart-legend">
            <div
              class="legend-dot"
              style="background: rgba(220, 38, 38, 0.4)"
            ></div>
            <span style="color: #fca5a5">空頭期間</span>
            <div
              class="legend-dot"
              style="background: rgba(34, 197, 94, 0.4)"
            ></div>
            <span style="color: #86efac">回升期間</span>
            <div
              class="legend-dot"
              style="background: rgba(251, 146, 60, 0.5)"
            ></div>
            <span style="color: #fdba74">回升中再空頭</span>
          </div>
          <button class="close-btn" onclick="closeChart()">✕ 關閉</button>
        </div>
        <div id="chart-loading" style="display: none">K 線載入中…</div>
        <div id="chart-container"></div>
      </div>
    </div>

    <script>
      /* ── 資料狀態 ── */
      let _data = [];
      let _sortCol = "peak_date";
      let _ohlc = null; // 快取 OHLC
      let _chart = null; // ECharts 實例
      let _activeRow = null;

      const MAX_DROP = 80;

      /* ── 格式化輔助 ── */
      function fmtNum(v) {
        if (v == null) return "—";
        return v.toLocaleString("zh-TW", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2,
        });
      }
      function recoveryStr(days, hasNested) {
        if (days == null) return '<span class="no-recovery">尚未回高</span>';
        const years = Math.floor(days / 365),
          rem = days % 365;
        let s = days.toLocaleString() + " 天";
        if (years > 0)
          s += `（約 ${years} 年${rem > 0 ? " " + rem + " 天" : ""}）`;
        return `<span class="recovery-days ${hasNested ? "long" : ""}">${s}</span>`;
      }

      /* ── 表格渲染 ── */
      function renderTable() {
        const sorted = [..._data].sort((a, b) => {
          let av = a[_sortCol],
            bv = b[_sortCol];
          if (_sortCol === "idx") {
            av = _data.indexOf(a);
            bv = _data.indexOf(b);
          }
          if (av == null && bv == null) return 0;
          if (av == null) return 1;
          if (bv == null) return -1;
          if (typeof av === "string") return bv.localeCompare(av);
          return bv - av;
        });

        document.getElementById("bear-tbody").innerHTML = sorted
          .map((r, i) => {
            const barW = Math.min(
              (Math.abs(r.drop_pct) / MAX_DROP) * 100,
              100,
            ).toFixed(1);
            return `<tr data-bear='${JSON.stringify(r)}'>
            <td class="left val-cell">${i + 1}</td>
            <td class="left date-cell">${r.peak_date}</td>
            <td class="val-cell col-peak-val">${fmtNum(r.peak_value)}</td>
            <td class="left date-cell col-trough-date">${r.trough_date}</td>
            <td class="val-cell col-trough-val">${fmtNum(r.trough_value)}</td>
            <td class="col-drop">
              <div class="bar-wrap">
                <span class="drop-pct">${r.drop_pct.toFixed(2)}%</span>
                <div class="bar-bg"><div class="bar-fill" style="width:${barW}%"></div></div>
              </div>
            </td>
            <td class="col-recdays">${recoveryStr(
              r.recovery_days,
              _data.some(
                (o) =>
                  o.peak_date !== r.peak_date &&
                  r.recovery_date &&
                  o.peak_date > r.trough_date &&
                  o.peak_date < r.recovery_date,
              ),
            )}</td>
            <td class="left event-cell col-event">${r.event || ""}</td>
          </tr>`;
          })
          .join("");

        /* 欄標題 */
        document.querySelectorAll("#bear-table th").forEach((th) => {
          th.classList.remove("sorted-desc");
          if (th.dataset.col === _sortCol) th.classList.add("sorted-desc");
        });

        /* 列點擊 → 開圖 */
        document.querySelectorAll("#bear-tbody tr").forEach((tr) => {
          tr.addEventListener("click", () => {
            const bear = JSON.parse(tr.dataset.bear);
            if (_activeRow) _activeRow.classList.remove("active");
            _activeRow = tr;
            tr.classList.add("active");
            openChart(bear);
          });
        });
      }

      document.querySelectorAll("#bear-table th").forEach((th) => {
        th.addEventListener("click", () => {
          _sortCol = th.dataset.col;
          renderTable();
        });
      });

      /* ── K 線：載入 OHLC ── */
      async function loadOhlc() {
        if (_ohlc) return _ohlc;
        const resp = await fetch("/api/ohlc");
        const data = await resp.json();
        if (data.error) throw new Error(data.error);
        _ohlc = data;
        return _ohlc;
      }

      /* ── K 線：開啟面板 ── */
      function openChart(bear) {
        const panel = document.getElementById("chart-panel");
        panel.style.display = "block";

        document.getElementById("chart-info").textContent =
          `${bear.peak_date} 高點 ${fmtNum(bear.peak_value)}　→　` +
          `${bear.trough_date} 低點 ${fmtNum(bear.trough_value)}　跌幅 ${bear.drop_pct.toFixed(2)}%` +
          (bear.event ? `　｜${bear.event}` : "");

        const loading = document.getElementById("chart-loading");
        loading.style.display = "block";
        document.getElementById("chart-container").style.display = "none";

        loadOhlc()
          .then((ohlc) => {
            loading.style.display = "none";
            document.getElementById("chart-container").style.display = "block";
            renderChart(bear, ohlc);
            panel.scrollIntoView({ behavior: "smooth", block: "nearest" });
          })
          .catch((err) => {
            loading.textContent = "K 線載入失敗：" + err.message;
          });
      }

      /* ── K 線：關閉面板 ── */
      function closeChart() {
        document.getElementById("chart-panel").style.display = "none";
        if (_activeRow) {
          _activeRow.classList.remove("active");
          _activeRow = null;
        }
      }

      /* ── K 線：渲染 ECharts ── */
      function renderChart(bear, ohlc) {
        const dates = ohlc.dates;
        const O = ohlc.open,
          H = ohlc.high,
          L = ohlc.low,
          C = ohlc.close;

        /* ECharts 格式：[open, close, low, high] */
        const candleData = dates.map((_, i) => [O[i], C[i], L[i], H[i]]);

        /* 計算初始縮放範圍（高點前 3 月 ~ 回高後 3 月） */
        const peakIdx = dates.indexOf(bear.peak_date);
        const troughIdx = dates.indexOf(bear.trough_date);
        const recIdx = bear.recovery_date
          ? dates.indexOf(bear.recovery_date)
          : -1;
        const bufPre = 60; // ~3 個月交易日
        const bufPost = 60;
        const startI = Math.max(0, peakIdx - bufPre);
        const endI =
          recIdx >= 0
            ? Math.min(dates.length - 1, recIdx + bufPost)
            : Math.min(dates.length - 1, troughIdx + 250);
        const zoomS = (startI / dates.length) * 100;
        const zoomE = (endI / dates.length) * 100;

        /* markArea：空頭紅 / 回升綠 */
        const markData = [
          [
            {
              xAxis: bear.peak_date,
              itemStyle: { color: "rgba(220,38,38,0.13)" },
            },
            { xAxis: bear.trough_date },
          ],
        ];
        if (bear.recovery_date) {
          markData.push([
            {
              xAxis: bear.trough_date,
              itemStyle: { color: "rgba(34,197,94,0.10)" },
            },
            { xAxis: bear.recovery_date },
          ]);
        }

        /* 回升期間內的巢狀空頭：橘色標示 + 箭頭說明 */
        const nestedMarkLineData = [];
        if (bear.recovery_date) {
          for (const other of _data) {
            if (other.peak_date === bear.peak_date) continue;
            if (
              other.peak_date > bear.trough_date &&
              other.peak_date < bear.recovery_date
            ) {
              markData.push([
                {
                  xAxis: other.peak_date,
                  itemStyle: { color: "rgba(251,146,60,0.22)" },
                },
                { xAxis: other.trough_date },
              ]);
              const pidx = dates.indexOf(other.peak_date);
              const tidx = dates.indexOf(other.trough_date);
              if (pidx >= 0 && tidx >= 0) {
                const midDate = dates[Math.floor((pidx + tidx) / 2)];
                nestedMarkLineData.push({
                  xAxis: midDate,
                  name: other.event || other.peak_date.slice(0, 7),
                });
              }
            }
          }
        }

        const option = {
          animation: false,
          backgroundColor: "#fff",
          grid: { left: "7%", right: "2%", top: "10%", bottom: "18%" },
          xAxis: {
            type: "category",
            data: dates,
            boundaryGap: true,
            axisLabel: {
              formatter: (v) => v.slice(0, 7),
              fontSize: 11,
              rotate: 30,
              color: "#64748b",
            },
            axisLine: { lineStyle: { color: "#e2e8f0" } },
            axisTick: { lineStyle: { color: "#e2e8f0" } },
          },
          yAxis: {
            type: "value",
            scale: true,
            splitLine: { lineStyle: { color: "#f1f5f9" } },
            axisLabel: {
              formatter: (v) => v.toLocaleString(),
              fontSize: 11,
              color: "#64748b",
            },
          },
          series: [
            {
              type: "candlestick",
              data: candleData,
              itemStyle: {
                color: "#ef4444" /* 陽線（漲）填色 */,
                color0: "#22c55e" /* 陰線（跌）填色 */,
                borderColor: "#ef4444",
                borderColor0: "#22c55e",
                borderWidth: 1,
              },
              markArea: {
                silent: true,
                data: markData,
              },
            },
            ...(nestedMarkLineData.length > 0
              ? [
                  {
                    type: "line",
                    data: [],
                    markLine: {
                      silent: true,
                      symbol: ["none", "arrow"],
                      symbolSize: 8,
                      lineStyle: {
                        color: "#f97316",
                        width: 1.5,
                        type: "dashed",
                      },
                      label: {
                        show: true,
                        position: "start",
                        formatter: (p) => p.name,
                        color: "#7c2d12",
                        fontSize: 10,
                        fontWeight: 600,
                        backgroundColor: "rgba(255,237,213,0.95)",
                        padding: [3, 8],
                        borderRadius: 4,
                        borderColor: "#f97316",
                        borderWidth: 1,
                      },
                      data: nestedMarkLineData,
                    },
                  },
                ]
              : []),
          ],
          tooltip: {
            trigger: "axis",
            axisPointer: { type: "cross", crossStyle: { color: "#94a3b8" } },
            backgroundColor: "#1e293b",
            borderColor: "#334155",
            textStyle: { color: "#e2e8f0", fontSize: 12 },
            formatter(params) {
              const p = params.find((x) => x.seriesType === "candlestick");
              if (!p) return "";
              const [o, c, l, h] = p.value;
              const up = c >= o;
              const cc = up ? "#fca5a5" : "#86efac";
              return `<b style="color:#f1f5f9">${p.name}</b><br/>
                開 ${o.toFixed(2)}&nbsp; 高 <span style="color:#fca5a5">${h.toFixed(2)}</span>&nbsp; 低 <span style="color:#86efac">${l.toFixed(2)}</span>&nbsp; 收 <span style="color:${cc}">${c.toFixed(2)}</span>`;
            },
          },
          dataZoom: [
            { type: "inside", start: zoomS, end: zoomE },
            {
              type: "slider",
              bottom: "4%",
              height: 22,
              start: zoomS,
              end: zoomE,
              borderColor: "#e2e8f0",
              fillerColor: "rgba(124,58,237,0.1)",
              handleStyle: { color: "#7c3aed" },
              textStyle: { fontSize: 10, color: "#64748b" },
            },
          ],
        };

        if (!_chart) {
          _chart = echarts.init(document.getElementById("chart-container"));
          window.addEventListener("resize", () => _chart.resize());
        }
        _chart.setOption(option, true);
        _chart.resize();
      }

      /* ── 欄位 toggle ── */
      (function initBearToggles() {
        const COLS = [
          { cls: "col-peak-val", label: "高點", on: false },
          { cls: "col-trough-date", label: "低點日期", on: false },
          { cls: "col-trough-val", label: "低點", on: false },
          { cls: "col-drop", label: "跌幅", on: true },
          { cls: "col-recdays", label: "回高天數", on: true },
          { cls: "col-event", label: "事件", on: true },
        ];
        const bar = document.getElementById("bear-toggle-bar");
        COLS.forEach((t) => {
          if (!t.on) document.body.classList.add("hide-" + t.cls);
          const btn = document.createElement("button");
          btn.className = "col-chip" + (t.on ? " on" : "");
          btn.textContent = t.label;
          btn.addEventListener("click", () => {
            const nowOn = btn.classList.toggle("on");
            document.body.classList.toggle("hide-" + t.cls, !nowOn);
          });
          bar.appendChild(btn);
        });
      })();

      /* ── 初始資料載入 ── */
      fetch("/api/bear")
        .then((r) => r.json())
        .then((data) => {
          document.getElementById("loading").style.display = "none";
          if (data.error) {
            const el = document.getElementById("error-msg");
            el.textContent = "載入失敗：" + data.error;
            el.style.display = "block";
            return;
          }
          document.getElementById("last-updated").textContent =
            data.last_updated || "—";
          _data = data.bears || [];
          document.getElementById("count-badge").textContent =
            _data.length + " 次";
          document.getElementById("table-wrap").style.display = "block";
          renderTable();
        })
        .catch((err) => {
          document.getElementById("loading").style.display = "none";
          const el = document.getElementById("error-msg");
          el.textContent = "網路錯誤：" + err;
          el.style.display = "block";
        });
    </script>
  </body>
</html>
