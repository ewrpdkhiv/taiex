<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TAIEX 空頭市場記錄</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          "Noto Sans TC",
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        background: #111827;
        color: #cbd5e1;
      }

      header {
        background: #111827;
        border-bottom: 1px solid #2d3f55;
        padding: 13px 20px;
        display: flex;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
      }
      header h1 {
        font-size: 0.95rem;
        font-weight: 600;
        color: #e2e8f0;
        letter-spacing: 0.02em;
        flex: 1;
      }
      header a.nav-link {
        font-size: 0.76rem;
        color: #475569;
        text-decoration: none;
        border: 1px solid #2d3f55;
        padding: 3px 10px;
        border-radius: 4px;
        white-space: nowrap;
        transition:
          color 0.15s,
          border-color 0.15s;
      }
      header a.nav-link:hover {
        color: #94a3b8;
        border-color: #334155;
      }

      .meta {
        padding: 9px 20px;
        font-size: 0.75rem;
        color: #334155;
        background: #162234;
        border-bottom: 1px solid #2d3f55;
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        align-items: center;
      }
      .meta b {
        color: #64748b;
      }
      .def-chip {
        display: inline-block;
        background: rgba(245, 158, 11, 0.1);
        color: #f59e0b;
        border: 1px solid rgba(245, 158, 11, 0.25);
        border-radius: 4px;
        padding: 2px 8px;
        font-size: 0.72rem;
      }

      .container {
        max-width: 1200px;
        margin: 20px auto;
        padding: 0 16px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .card {
        background: #1f2937;
        border-radius: 6px;
        border: 1px solid #2d3f55;
        overflow: hidden;
      }
      .card-header {
        background: #162234;
        border-bottom: 1px solid #2d3f55;
        border-left: 3px solid #8b5cf6;
        color: #e2e8f0;
        padding: 12px 20px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .card-header h2 {
        font-size: 0.9rem;
        font-weight: 600;
        flex: 1;
        color: #94a3b8;
      }
      .badge {
        background: rgba(139, 92, 246, 0.15);
        color: #8b5cf6;
        border: 1px solid rgba(139, 92, 246, 0.3);
        border-radius: 3px;
        padding: 2px 8px;
        font-size: 0.72rem;
        font-family: "JetBrains Mono", monospace;
      }

      .table-wrap {
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.82rem;
      }
      th {
        background: #162234;
        padding: 9px 12px;
        text-align: right;
        font-weight: 500;
        color: #334155;
        border-bottom: 1px solid #2d3f55;
        white-space: nowrap;
        cursor: pointer;
        user-select: none;
        font-size: 0.7rem;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }
      th:first-child,
      th.left {
        text-align: left;
      }
      th:hover {
        color: #475569;
      }
      th.sorted-desc::after {
        content: " ▼";
        font-size: 0.65rem;
        color: #8b5cf6;
      }

      tbody tr {
        cursor: pointer;
      }
      td {
        padding: 10px 12px;
        border-bottom: 1px solid #1b2b3f;
        text-align: right;
        vertical-align: middle;
        color: #64748b;
      }
      td:first-child,
      td.left {
        text-align: left;
      }
      tr:last-child td {
        border-bottom: none;
      }
      tbody tr:hover td {
        background: rgba(139, 92, 246, 0.04);
      }
      tbody tr.active td {
        background: rgba(139, 92, 246, 0.1);
      }

      .date-cell {
        font-family: "JetBrains Mono", monospace;
        font-size: 0.79rem;
        color: #64748b;
        white-space: nowrap;
      }
      .val-cell {
        font-family: "JetBrains Mono", monospace;
        font-size: 0.79rem;
        color: #475569;
      }
      .drop-pct {
        font-weight: 700;
        color: #f43f5e;
        font-family: "JetBrains Mono", monospace;
      }

      .bar-wrap {
        display: flex;
        align-items: center;
        gap: 6px;
        justify-content: flex-end;
      }
      .bar-bg {
        width: 70px;
        height: 4px;
        background: rgba(244, 63, 94, 0.12);
        border-radius: 2px;
        overflow: hidden;
        flex-shrink: 0;
      }
      .bar-fill {
        height: 100%;
        background: #f43f5e;
        border-radius: 2px;
      }

      .recovery-days {
        color: #475569;
        font-size: 0.79rem;
        font-family: "JetBrains Mono", monospace;
      }
      .recovery-days.long {
        color: #f59e0b;
      }
      .no-recovery {
        color: #2d3f55;
        font-style: italic;
        font-size: 0.77rem;
      }
      .event-cell {
        color: #334155;
        font-size: 0.77rem;
        max-width: 240px;
      }

      .hide-col-peak-val .col-peak-val {
        display: none;
      }
      .hide-col-trough-date .col-trough-date {
        display: none;
      }
      .hide-col-trough-val .col-trough-val {
        display: none;
      }
      .hide-col-drop .col-drop {
        display: none;
      }
      .hide-col-recdays .col-recdays {
        display: none;
      }
      .hide-col-event .col-event {
        display: none;
      }

      #bear-toggle-bar {
        background: #162234;
        border-bottom: 1px solid #2d3f55;
        padding: 6px 16px;
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
      }
      #bear-toggle-bar .toggle-label {
        font-size: 0.7rem;
        color: #2d3f55;
        white-space: nowrap;
        margin-right: 2px;
      }
      .col-chip {
        padding: 2px 9px;
        font-size: 0.7rem;
        border-radius: 3px;
        border: 1px solid #2d3f55;
        background: transparent;
        color: #334155;
        cursor: pointer;
        transition: all 0.15s;
      }
      .col-chip:hover {
        border-color: #334155;
        color: #64748b;
      }
      .col-chip.on {
        background: #243448;
        border-color: #334155;
        color: #e2e8f0;
      }

      #loading {
        text-align: center;
        padding: 60px 20px;
        color: #2d3f55;
      }
      #error-msg {
        display: none;
        text-align: center;
        padding: 40px;
        color: #f43f5e;
      }

      #chart-panel {
        display: none;
      }
      .chart-panel-header {
        background: #162234;
        border-bottom: 1px solid #2d3f55;
        color: #e2e8f0;
        padding: 11px 16px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .chart-panel-header .chart-info {
        flex: 1;
        font-size: 0.8rem;
        color: #64748b;
      }
      .chart-legend {
        display: flex;
        gap: 14px;
        align-items: center;
        font-size: 0.73rem;
      }
      .legend-dot {
        width: 10px;
        height: 10px;
        border-radius: 2px;
        flex-shrink: 0;
      }
      .close-btn {
        background: none;
        border: 1px solid #2d3f55;
        color: #475569;
        border-radius: 4px;
        padding: 3px 10px;
        cursor: pointer;
        font-size: 0.76rem;
      }
      .close-btn:hover {
        color: #94a3b8;
        border-color: #334155;
      }
      #chart-loading {
        text-align: center;
        padding: 40px;
        color: #334155;
      }
      #chart-container {
        height: 560px;
      }

      .refresh-btn {
        background: none;
        border: 1px solid #2d3f55;
        color: #334155;
        border-radius: 4px;
        padding: 2px 8px;
        font-size: 0.71rem;
        cursor: pointer;
        transition:
          background 0.15s,
          color 0.15s;
      }
      .refresh-btn:hover:not(:disabled) {
        background: #243448;
        color: #64748b;
        border-color: #334155;
      }
      .refresh-btn:disabled {
        opacity: 0.4;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>🐻 TAIEX 空頭市場記錄</h1>
      <a href="/" class="nav-link">漲跌排行 →</a>
      <a href="/dca" class="nav-link">定期定額試算 →</a>
    </header>

    <div class="meta">
      <span>更新：<b id="last-updated">載入中…</b></span>
      <button id="refresh-btn" class="refresh-btn">刷新</button>
      <span class="def-chip">定義：高點到低點跌幅 ≥ 20%</span>
      <span>回高天數 = 從高點起算至回到高點水準的日曆天</span>
    </div>

    <div id="bear-toggle-bar">
      <span class="toggle-label">欄位：</span>
    </div>

    <div class="container">
      <!-- 空頭列表 -->
      <div class="card">
        <div class="card-header">
          <h2>台股加權指數 歷史空頭市場</h2>
          <span class="badge" id="count-badge">—</span>
        </div>
        <div id="loading">資料載入中…</div>
        <div id="error-msg"></div>
        <div class="table-wrap" id="table-wrap" style="display: none">
          <table id="bear-table">
            <thead>
              <tr>
                <th class="left" data-col="idx">#</th>
                <th class="left" data-col="peak_date">高點日期</th>
                <th class="col-peak-val" data-col="peak_value">高點</th>
                <th class="left col-trough-date" data-col="trough_date">
                  低點日期
                </th>
                <th class="col-trough-val" data-col="trough_value">低點</th>
                <th class="col-drop" data-col="drop_pct">跌幅</th>
                <th class="col-recdays" data-col="recovery_days">回高天數</th>
                <th class="left col-event" data-col="event">事件</th>
              </tr>
            </thead>
            <tbody id="bear-tbody"></tbody>
          </table>
        </div>
      </div>

      <!-- K 線圖面板（點擊列後出現） -->
      <div class="card" id="chart-panel">
        <div class="chart-panel-header">
          <span class="chart-info" id="chart-info">—</span>
          <div class="chart-legend">
            <div
              class="legend-dot"
              style="background: rgba(220, 38, 38, 0.4)"
            ></div>
            <span style="color: #fca5a5">空頭期間</span>
            <div
              class="legend-dot"
              style="background: rgba(34, 197, 94, 0.4)"
            ></div>
            <span style="color: #86efac">回升期間</span>
            <div
              class="legend-dot"
              style="background: rgba(251, 146, 60, 0.5)"
            ></div>
            <span style="color: #fdba74">回升中再空頭</span>
          </div>
          <button class="close-btn" onclick="closeChart()">✕ 關閉</button>
        </div>
        <div id="chart-loading" style="display: none">K 線載入中…</div>
        <div id="chart-container"></div>
      </div>
    </div>

    <script>
      /* ── 資料狀態 ── */
      let _data = [];
      let _sortCol = "peak_date";
      let _ohlc = null; // 快取 OHLC
      let _chart = null; // ECharts 實例
      let _activeRow = null;

      const MAX_DROP = 80;

      /* ── 格式化輔助 ── */
      function fmtNum(v) {
        if (v == null) return "—";
        return v.toLocaleString("zh-TW", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2,
        });
      }
      function recoveryStr(days, hasNested) {
        if (days == null) return '<span class="no-recovery">尚未回高</span>';
        const years = Math.floor(days / 365),
          rem = days % 365;
        let s = days.toLocaleString() + " 天";
        if (years > 0)
          s += `（約 ${years} 年${rem > 0 ? " " + rem + " 天" : ""}）`;
        return `<span class="recovery-days ${hasNested ? "long" : ""}">${s}</span>`;
      }

      /* ── 表格渲染 ── */
      function renderTable() {
        const sorted = [..._data].sort((a, b) => {
          let av = a[_sortCol],
            bv = b[_sortCol];
          if (_sortCol === "idx") {
            av = _data.indexOf(a);
            bv = _data.indexOf(b);
          }
          if (av == null && bv == null) return 0;
          if (av == null) return 1;
          if (bv == null) return -1;
          if (typeof av === "string") return bv.localeCompare(av);
          return bv - av;
        });

        document.getElementById("bear-tbody").innerHTML = sorted
          .map((r, i) => {
            const barW = Math.min(
              (Math.abs(r.drop_pct) / MAX_DROP) * 100,
              100,
            ).toFixed(1);
            return `<tr data-bear='${JSON.stringify(r)}'>
            <td class="left val-cell">${i + 1}</td>
            <td class="left date-cell">${r.peak_date}</td>
            <td class="val-cell col-peak-val">${fmtNum(r.peak_value)}</td>
            <td class="left date-cell col-trough-date">${r.trough_date}</td>
            <td class="val-cell col-trough-val">${fmtNum(r.trough_value)}</td>
            <td class="col-drop">
              <div class="bar-wrap">
                <span class="drop-pct">${r.drop_pct.toFixed(2)}%</span>
                <div class="bar-bg"><div class="bar-fill" style="width:${barW}%"></div></div>
              </div>
            </td>
            <td class="col-recdays">${recoveryStr(
              r.recovery_days,
              _data.some(
                (o) =>
                  o.peak_date !== r.peak_date &&
                  r.recovery_date &&
                  o.peak_date > r.trough_date &&
                  o.peak_date < r.recovery_date,
              ),
            )}</td>
            <td class="left event-cell col-event">${r.event || ""}</td>
          </tr>`;
          })
          .join("");

        /* 欄標題 */
        document.querySelectorAll("#bear-table th").forEach((th) => {
          th.classList.remove("sorted-desc");
          if (th.dataset.col === _sortCol) th.classList.add("sorted-desc");
        });

        /* 列點擊 → 開圖 */
        document.querySelectorAll("#bear-tbody tr").forEach((tr) => {
          tr.addEventListener("click", () => {
            const bear = JSON.parse(tr.dataset.bear);
            if (_activeRow) _activeRow.classList.remove("active");
            _activeRow = tr;
            tr.classList.add("active");
            openChart(bear);
          });
        });
      }

      document.querySelectorAll("#bear-table th").forEach((th) => {
        th.addEventListener("click", () => {
          _sortCol = th.dataset.col;
          renderTable();
        });
      });

      /* ── K 線：載入 OHLC ── */
      async function loadOhlc() {
        if (_ohlc) return _ohlc;
        const resp = await fetch("/api/ohlc");
        const data = await resp.json();
        if (data.error) throw new Error(data.error);
        _ohlc = data;
        return _ohlc;
      }

      /* ── K 線：開啟面板 ── */
      function openChart(bear) {
        const panel = document.getElementById("chart-panel");
        panel.style.display = "block";

        document.getElementById("chart-info").textContent =
          `${bear.peak_date} 高點 ${fmtNum(bear.peak_value)}　→　` +
          `${bear.trough_date} 低點 ${fmtNum(bear.trough_value)}　跌幅 ${bear.drop_pct.toFixed(2)}%` +
          (bear.event ? `　｜${bear.event}` : "");

        const loading = document.getElementById("chart-loading");
        loading.style.display = "block";
        document.getElementById("chart-container").style.display = "none";

        loadOhlc()
          .then((ohlc) => {
            loading.style.display = "none";
            document.getElementById("chart-container").style.display = "block";
            renderChart(bear, ohlc);
            panel.scrollIntoView({ behavior: "smooth", block: "nearest" });
          })
          .catch((err) => {
            loading.textContent = "K 線載入失敗：" + err.message;
          });
      }

      /* ── K 線：關閉面板 ── */
      function closeChart() {
        document.getElementById("chart-panel").style.display = "none";
        if (_activeRow) {
          _activeRow.classList.remove("active");
          _activeRow = null;
        }
      }

      /* ── K 線：渲染 ECharts ── */
      function renderChart(bear, ohlc) {
        const dates = ohlc.dates;
        const O = ohlc.open,
          H = ohlc.high,
          L = ohlc.low,
          C = ohlc.close;
        const vixRaw = ohlc.vix || [];

        /* ECharts 格式：[open, close, low, high] */
        const candleData = dates.map((_, i) => [O[i], C[i], L[i], H[i]]);
        /* VIX：null 留空（ECharts 顯示斷點） */
        const vixData = dates.map((_, i) => vixRaw[i] ?? null);

        /* 計算初始縮放範圍（高點前 3 月 ~ 回高後 3 月） */
        const peakIdx = dates.indexOf(bear.peak_date);
        const troughIdx = dates.indexOf(bear.trough_date);
        const recIdx = bear.recovery_date
          ? dates.indexOf(bear.recovery_date)
          : -1;
        const bufPre = 60; // ~3 個月交易日
        const bufPost = 60;
        const startI = Math.max(0, peakIdx - bufPre);
        const endI =
          recIdx >= 0
            ? Math.min(dates.length - 1, recIdx + bufPost)
            : Math.min(dates.length - 1, troughIdx + 250);
        const zoomS = (startI / dates.length) * 100;
        const zoomE = (endI / dates.length) * 100;

        /* markArea：空頭紅 / 回升綠 */
        const markData = [
          [
            {
              xAxis: bear.peak_date,
              itemStyle: { color: "rgba(220,38,38,0.13)" },
            },
            { xAxis: bear.trough_date },
          ],
        ];
        if (bear.recovery_date) {
          markData.push([
            {
              xAxis: bear.trough_date,
              itemStyle: { color: "rgba(34,197,94,0.10)" },
            },
            { xAxis: bear.recovery_date },
          ]);
        }

        /* 回升期間內的巢狀空頭：橘色標示 + 箭頭說明 */
        const nestedMarkLineData = [];
        if (bear.recovery_date) {
          for (const other of _data) {
            if (other.peak_date === bear.peak_date) continue;
            if (
              other.peak_date > bear.trough_date &&
              other.peak_date < bear.recovery_date
            ) {
              markData.push([
                {
                  xAxis: other.peak_date,
                  itemStyle: { color: "rgba(251,146,60,0.22)" },
                },
                { xAxis: other.trough_date },
              ]);
              const pidx = dates.indexOf(other.peak_date);
              const tidx = dates.indexOf(other.trough_date);
              if (pidx >= 0 && tidx >= 0) {
                const midDate = dates[Math.floor((pidx + tidx) / 2)];
                nestedMarkLineData.push({
                  xAxis: midDate,
                  name: other.event || other.peak_date.slice(0, 7),
                });
              }
            }
          }
        }

        const option = {
          animation: false,
          backgroundColor: "#1f2937",
          axisPointer: { link: [{ xAxisIndex: "all" }] },
          grid: [
            { left: "7%", right: "3%", top: "6%", bottom: "42%" },
            { left: "7%", right: "3%", top: "66%", bottom: "12%" },
          ],
          xAxis: [
            {
              type: "category",
              data: dates,
              boundaryGap: true,
              gridIndex: 0,
              axisLabel: { show: false },
              axisLine: { lineStyle: { color: "#2d3f55" } },
              axisTick: { show: false },
            },
            {
              type: "category",
              data: dates,
              boundaryGap: true,
              gridIndex: 1,
              axisLabel: {
                formatter: (v) => v.slice(0, 7),
                fontSize: 10,
                rotate: 30,
                color: "#475569",
              },
              axisLine: { lineStyle: { color: "#2d3f55" } },
              axisTick: { lineStyle: { color: "#2d3f55" } },
            },
          ],
          yAxis: [
            {
              type: "value",
              scale: true,
              gridIndex: 0,
              splitLine: { lineStyle: { color: "#2d3f55" } },
              axisLabel: {
                formatter: (v) => v.toLocaleString(),
                fontSize: 11,
                color: "#64748b",
              },
            },
            {
              type: "value",
              scale: true,
              gridIndex: 1,
              splitLine: { lineStyle: { color: "#1e3048" } },
              axisLabel: { fontSize: 10, color: "#64748b" },
              name: "VIX",
              nameTextStyle: { color: "#f59e0b", fontSize: 10 },
            },
          ],
          series: [
            {
              type: "candlestick",
              data: candleData,
              xAxisIndex: 0,
              yAxisIndex: 0,
              itemStyle: {
                color: "#ef4444",
                color0: "#22c55e",
                borderColor: "#ef4444",
                borderColor0: "#22c55e",
                borderWidth: 1,
              },
              markArea: { silent: true, data: markData },
            },
            ...(nestedMarkLineData.length > 0
              ? [
                  {
                    type: "line",
                    data: [],
                    xAxisIndex: 0,
                    yAxisIndex: 0,
                    markLine: {
                      silent: true,
                      symbol: ["none", "arrow"],
                      symbolSize: 8,
                      lineStyle: {
                        color: "#f97316",
                        width: 1.5,
                        type: "dashed",
                      },
                      label: {
                        show: true,
                        position: "start",
                        formatter: (p) => p.name,
                        color: "#7c2d12",
                        fontSize: 10,
                        fontWeight: 600,
                        backgroundColor: "rgba(255,237,213,0.95)",
                        padding: [3, 8],
                        borderRadius: 4,
                        borderColor: "#f97316",
                        borderWidth: 1,
                      },
                      data: nestedMarkLineData,
                    },
                  },
                ]
              : []),
            {
              type: "line",
              name: "VIX",
              data: vixData,
              xAxisIndex: 1,
              yAxisIndex: 1,
              symbol: "none",
              lineStyle: { color: "#f59e0b", width: 1.5 },
              areaStyle: { color: "rgba(245,158,11,0.06)" },
              connectNulls: false,
              markLine: {
                silent: true,
                symbol: "none",
                lineStyle: {
                  color: "#f59e0b",
                  type: "dashed",
                  width: 1,
                  opacity: 0.4,
                },
                label: { fontSize: 9, color: "#f59e0b", position: "end" },
                data: [
                  { yAxis: 30, name: "30" },
                  { yAxis: 40, name: "40" },
                ],
              },
            },
          ],
          tooltip: {
            trigger: "axis",
            axisPointer: { type: "cross", crossStyle: { color: "#94a3b8" } },
            backgroundColor: "#162234",
            borderColor: "#2d3f55",
            textStyle: { color: "#e2e8f0", fontSize: 12 },
            position(point, params, dom, rect, size) {
              const [px] = point;
              const [cw, ch] = size.viewSize;
              const dw = dom.offsetWidth || 100;
              const x = px + dw + 16 > cw ? px - dw - 8 : px + 12;
              return [x, ch * 0.08];
            },
            formatter(params) {
              const p = params.find((x) => x.seriesType === "candlestick");
              const v = params.find((x) => x.seriesName === "VIX");
              if (!p) return "";
              const [o, c] = p.value;
              const cc = c >= o ? "#fca5a5" : "#86efac";
              const vStr =
                v?.value != null
                  ? `<br/><span style="color:#f59e0b">VIX ${v.value.toFixed(1)}</span>`
                  : "";
              return `<span style="color:#94a3b8;font-size:11px">${p.name}</span><br/><span style="color:${cc}">${c.toFixed(2)}</span>${vStr}`;
            },
          },
          dataZoom: [
            { type: "inside", xAxisIndex: [0, 1], start: zoomS, end: zoomE },
            {
              type: "slider",
              xAxisIndex: [0, 1],
              bottom: "3%",
              height: 20,
              start: zoomS,
              end: zoomE,
              borderColor: "#2d3f55",
              fillerColor: "rgba(139,92,246,0.12)",
              handleStyle: { color: "#8b5cf6" },
              textStyle: { fontSize: 10, color: "#475569" },
            },
          ],
        };

        if (!_chart) {
          _chart = echarts.init(document.getElementById("chart-container"));
          window.addEventListener("resize", () => _chart.resize());
        }
        _chart.setOption(option, true);
        _chart.resize();
      }

      /* ── 欄位 toggle ── */
      (function initBearToggles() {
        const COLS = [
          { cls: "col-peak-val", label: "高點", on: false },
          { cls: "col-trough-date", label: "低點日期", on: false },
          { cls: "col-trough-val", label: "低點", on: false },
          { cls: "col-drop", label: "跌幅", on: true },
          { cls: "col-recdays", label: "回高天數", on: true },
          { cls: "col-event", label: "事件", on: true },
        ];
        const bar = document.getElementById("bear-toggle-bar");
        COLS.forEach((t) => {
          if (!t.on) document.body.classList.add("hide-" + t.cls);
          const btn = document.createElement("button");
          btn.className = "col-chip" + (t.on ? " on" : "");
          btn.textContent = t.label;
          btn.addEventListener("click", () => {
            const nowOn = btn.classList.toggle("on");
            document.body.classList.toggle("hide-" + t.cls, !nowOn);
          });
          bar.appendChild(btn);
        });
      })();

      /* ── 初始資料載入 ── */
      function loadBear() {
        fetch("/api/bear")
          .then((r) => r.json())
          .then((data) => {
            document.getElementById("loading").style.display = "none";
            if (data.error) {
              const el = document.getElementById("error-msg");
              el.textContent = "載入失敗：" + data.error;
              el.style.display = "block";
              return;
            }
            document.getElementById("last-updated").textContent =
              data.last_updated || "—";
            _data = data.bears || [];
            document.getElementById("count-badge").textContent =
              _data.length + " 次";
            document.getElementById("table-wrap").style.display = "block";
            renderTable();
          })
          .catch((err) => {
            document.getElementById("loading").style.display = "none";
            const el = document.getElementById("error-msg");
            el.textContent = "網路錯誤：" + err;
            el.style.display = "block";
          });
      }
      loadBear();

      (function () {
        const btn = document.getElementById("refresh-btn");
        btn.addEventListener("click", async () => {
          btn.disabled = true;
          btn.textContent = "刷新中…";
          const orig = document.getElementById("last-updated").textContent;
          try {
            await fetch("/api/refresh", { method: "POST" });
          } catch {}
          let n = 0;
          const t = setInterval(async () => {
            n++;
            try {
              const d = await (await fetch("/api/bear")).json();
              if (d.last_updated !== orig || n >= 60) {
                clearInterval(t);
                btn.disabled = false;
                btn.textContent = "刷新";
                if (d.last_updated !== orig) loadBear();
              }
            } catch {}
          }, 2000);
        });
      })();
    </script>
  </body>
</html>
