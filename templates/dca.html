<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>定期定額試算</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC",
          sans-serif;
        background: #f0f2f5;
        color: #333;
      }

      header {
        background: #1a1a2e;
        color: #fff;
        padding: 16px 20px;
        display: flex;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
      }
      header a {
        color: #94a3b8;
        font-size: 0.82rem;
        text-decoration: none;
        border: 1px solid #334155;
        padding: 4px 10px;
        border-radius: 5px;
      }
      header a:hover {
        color: #e2e8f0;
        border-color: #475569;
      }
      header h1 {
        font-size: 1.1rem;
        font-weight: 600;
      }
      .meta {
        margin-left: auto;
        font-size: 0.78rem;
        color: #94a3b8;
      }
      .meta b {
        color: #cbd5e1;
      }

      #error-banner {
        display: none;
        background: #fee2e2;
        color: #b91c1c;
        padding: 10px 20px;
        font-size: 0.85rem;
      }

      .container {
        max-width: 1120px;
        margin: 24px auto;
        padding: 0 14px;
      }

      .info-bar {
        background: #fff;
        border-radius: 10px;
        padding: 14px 20px;
        margin-bottom: 16px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.07);
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        align-items: center;
        font-size: 0.85rem;
        color: #475569;
      }
      .info-bar b {
        color: #1e293b;
      }
      .info-bar .period {
        margin-left: auto;
        font-size: 0.82rem;
        color: #64748b;
      }
      .info-bar .period b {
        color: #334155;
      }

      .table-wrap {
        background: #fff;
        border-radius: 10px;
        box-shadow: 0 1px 6px rgba(0, 0, 0, 0.08);
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.85rem;
      }

      thead tr {
        background: #1e293b;
        color: #e2e8f0;
      }
      thead th {
        padding: 11px 12px;
        font-weight: 600;
        text-align: right;
        white-space: nowrap;
      }
      .th-sort {
        cursor: pointer;
        user-select: none;
        opacity: 0.7;
      }
      .th-sort:hover {
        opacity: 1;
      }
      .th-active {
        cursor: pointer;
        user-select: none;
        color: #fbbf24;
      }
      .sort-arrow {
        font-size: 0.75rem;
        margin-left: 3px;
      }
      thead th:nth-child(1) {
        text-align: center;
        width: 40px;
      }
      thead th:nth-child(2) {
        text-align: left;
        width: 130px;
      }
      td:nth-child(2) {
        max-width: 130px;
      }

      tbody tr {
        border-bottom: 1px solid #f1f5f9;
        transition: background 0.1s;
      }
      tbody tr:last-child {
        border-bottom: none;
      }
      tbody tr:hover {
        background: #f8fafc;
      }

      td {
        padding: 11px 12px;
        text-align: right;
        white-space: nowrap;
      }
      td:nth-child(1) {
        text-align: center;
        color: #94a3b8;
        font-size: 0.78rem;
        font-weight: 600;
      }
      td:nth-child(2) {
        text-align: left;
      }

      .ticker {
        font-weight: 700;
        color: #1e293b;
        font-size: 0.88rem;
      }
      .name {
        color: #64748b;
        font-size: 0.76rem;
        margin-top: 1px;
      }

      .pos {
        color: #16a34a;
        font-weight: 700;
      }
      .neg {
        color: #dc2626;
        font-weight: 700;
      }
      .mid {
        color: #d97706;
        font-weight: 700;
      }
      .sub {
        font-size: 0.76rem;
        color: #64748b;
        margin-top: 2px;
      }

      .bar-wrap {
        display: flex;
        align-items: center;
        gap: 10px;
        justify-content: flex-end;
      }
      .bar {
        height: 6px;
        border-radius: 3px;
        min-width: 2px;
        background: #16a34a;
        flex-shrink: 0;
      }
      .bar.neg-bar {
        background: #dc2626;
      }

      .period-btns {
        display: flex;
        gap: 6px;
      }
      .period-btn {
        background: none;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        padding: 4px 12px;
        font-size: 0.82rem;
        color: #64748b;
        cursor: pointer;
      }
      .period-btn:hover {
        border-color: #94a3b8;
        color: #334155;
      }
      .period-btn.active {
        background: #1e293b;
        border-color: #1e293b;
        color: #fff;
        font-weight: 600;
      }
      .period-btn.crash {
        border-color: #fca5a5;
        color: #b91c1c;
      }
      .period-btn.crash:hover {
        border-color: #f87171;
        color: #991b1b;
      }
      .period-btn.crash.active {
        background: #b91c1c;
        border-color: #b91c1c;
        color: #fff;
      }

      .loading-msg {
        padding: 48px;
        text-align: center;
        color: #94a3b8;
        font-size: 0.9rem;
      }

      .filter-bar {
        background: #fff;
        border-radius: 10px;
        padding: 10px 16px;
        margin-bottom: 10px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.07);
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
      }
      .filter-group {
        display: flex;
        gap: 4px;
        align-items: center;
      }
      .filter-group + .filter-group {
        padding-left: 10px;
        border-left: 1px solid #e2e8f0;
      }
      .filter-label {
        font-size: 0.73rem;
        color: #94a3b8;
        margin-right: 2px;
        white-space: nowrap;
      }
      .filter-chip {
        border: 1px solid #cbd5e1;
        border-radius: 20px;
        padding: 3px 11px;
        font-size: 0.78rem;
        color: #64748b;
        cursor: pointer;
        user-select: none;
        background: none;
        transition:
          background 0.1s,
          color 0.1s,
          border-color 0.1s;
      }
      .filter-chip:hover {
        border-color: #94a3b8;
        color: #334155;
      }
      .filter-chip.active {
        background: #1e293b;
        border-color: #1e293b;
        color: #fff;
      }

      .col-toggle-bar {
        background: #fff;
        border-radius: 10px;
        padding: 10px 16px;
        margin-bottom: 10px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.07);
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }
      .col-toggle-bar .label {
        font-size: 0.75rem;
        color: #94a3b8;
        margin-right: 4px;
        white-space: nowrap;
      }
      .col-chip {
        border: 1px solid #cbd5e1;
        border-radius: 20px;
        padding: 3px 12px;
        font-size: 0.78rem;
        color: #64748b;
        cursor: pointer;
        user-select: none;
        background: none;
        transition:
          background 0.1s,
          color 0.1s,
          border-color 0.1s;
      }
      .col-chip:hover {
        border-color: #94a3b8;
        color: #334155;
      }
      .col-chip.on {
        background: #1e293b;
        border-color: #1e293b;
        color: #fff;
      }

      /* ── 手機響應式 ── */
      @media (max-width: 600px) {
        header {
          padding: 10px 14px;
          gap: 10px;
        }
        header h1 {
          font-size: 0.95rem;
        }
        .meta {
          font-size: 0.72rem;
          margin-left: 0;
          width: 100%;
        }

        .container {
          margin: 10px auto;
          padding: 0 8px;
        }

        .info-bar {
          flex-direction: column;
          align-items: flex-start;
          gap: 8px;
          padding: 10px 14px;
        }
        .info-bar > span:first-child {
          font-size: 0.78rem;
        }
        .info-bar .period {
          margin-left: 0;
          font-size: 0.78rem;
        }

        .table-wrap {
          overflow-x: auto;
          -webkit-overflow-scrolling: touch;
          border-radius: 8px;
        }

        table {
          font-size: 0.78rem;
          min-width: 340px;
        }
        thead th {
          padding: 8px 8px;
          font-size: 0.74rem;
        }
        td {
          padding: 9px 8px;
        }

        /* 第一欄（#）固定 */
        thead th:nth-child(1),
        td:nth-child(1) {
          position: sticky;
          left: 0;
          background: inherit;
          z-index: 1;
        }
        thead th:nth-child(1) {
          background: #1e293b;
        }

        .bar {
          display: none;
        }
        .bar-wrap {
          gap: 0;
        }

        .ticker {
          font-size: 0.82rem;
        }
        .name {
          font-size: 0.69rem;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <a href="/">← 漲跌日排行</a>
      <a href="/bear">空頭市場記錄 →</a>
      <h1>定期定額試算</h1>
      <div class="meta">更新：<b id="last-updated">載入中…</b></div>
    </header>

    <div id="error-banner"></div>

    <div class="container">
      <div class="info-bar" id="info-bar">
        <span
          >每月 <b>5 日</b> 投入
          <b>10,000 元</b>・允許小數股・股息隔天再投入</span
        >
        <span class="period">回測期間：<b id="period-text">載入中…</b></span>
        <div class="period-btns">
          <button class="period-btn active" onclick="setPeriod('10y', this)">
            近10年
          </button>
          <button class="period-btn" onclick="setPeriod('5y', this)">
            近5年
          </button>
          <button
            class="period-btn crash"
            onclick="setPeriod('crash_10y', this)"
          >
            股災前10年
          </button>
          <button
            class="period-btn crash"
            onclick="setPeriod('crash_5y', this)"
          >
            股災前5年
          </button>
        </div>
      </div>

      <div class="filter-bar" id="filter-bar"></div>

      <div class="col-toggle-bar" id="col-toggles">
        <span class="label">欄位：</span>
      </div>

      <div class="table-wrap">
        <div id="table-container">
          <div class="loading-msg">資料載入中，首次約需 60 秒…</div>
        </div>
      </div>
    </div>

    <script>
      function rateStr(r) {
        if (r == null) return "—";
        return (r >= 0 ? "+" : "") + r.toFixed(2) + "%";
      }
      function rateClass(r) {
        if (r == null) return "";
        return r >= 0 ? "pos" : "neg";
      }

      let _cache = {};
      let _results = [];
      let _sortKey = "irr";
      let _visibleCols = new Set(["irr", "max_drawdown", "calmar"]);
      let _filters = { market: null, type: null, special: new Set() };

      const FILTER_GROUPS = [
        {
          key: "market",
          label: "市場",
          chips: [
            { val: "tw", label: "臺股" },
            { val: "us", label: "美股" },
          ],
        },
        {
          key: "type",
          label: "類型",
          chips: [
            { val: "stock", label: "個股" },
            { val: "etf", label: "ETF" },
          ],
        },
        {
          key: "special",
          label: "特殊",
          chips: [
            { val: "finance", label: "金融股" },
            { val: "leveraged", label: "槓桿ETF" },
          ],
        },
      ];

      function applyFilters(results) {
        return results.filter((d) => {
          const tags = d.tags || [];
          if (_filters.market && !tags.includes(_filters.market)) return false;
          if (_filters.type && !tags.includes(_filters.type)) return false;
          if (
            _filters.special.size > 0 &&
            ![..._filters.special].some((s) => tags.includes(s))
          )
            return false;
          return true;
        });
      }

      function setFilter(groupKey, val) {
        if (groupKey === "special") {
          if (_filters.special.has(val)) _filters.special.delete(val);
          else _filters.special.add(val);
        } else {
          _filters[groupKey] = _filters[groupKey] === val ? null : val;
        }
        document.getElementById("filter-bar").innerHTML = renderFilterBar();
        document.getElementById("table-container").innerHTML = renderTable();
      }

      function renderFilterBar() {
        return FILTER_GROUPS.map((g) => {
          const chips = g.chips
            .map((c) => {
              const isActive =
                g.key === "special"
                  ? _filters.special.has(c.val)
                  : _filters[g.key] === c.val;
              return `<button class="filter-chip ${isActive ? "active" : ""}" onclick="setFilter('${g.key}','${c.val}')">${c.label}</button>`;
            })
            .join("");
          return `<div class="filter-group"><span class="filter-label">${g.label}</span>${chips}</div>`;
        }).join("");
      }

      const COL_DEFS = [
        { key: "invested", label: "成本", sortable: true },
        { key: "shares", label: "股數", sortable: false },
        { key: "market_value", label: "市值", sortable: true },
        { key: "last_price", label: "收盤價", sortable: true },
        { key: "market_cap", label: "股票市值", sortable: true },
        { key: "pnl", label: "損益", sortable: true },
        { key: "return_rate", label: "總報酬", sortable: true },
        { key: "irr", label: "XIRR", sortable: true },
        { key: "max_drawdown", label: "最大回撤", sortable: true },
        { key: "calmar", label: "Calmar", sortable: true },
      ];

      function moneyStr(v) {
        if (v == null) return "—";
        return Math.round(v).toLocaleString();
      }
      function sharesStr(v) {
        if (v == null) return "—";
        return v.toFixed(2);
      }
      function mktCapStr(v) {
        if (v == null) return "—";
        if (v >= 1e12) return (v / 1e12).toFixed(2) + " 兆";
        if (v >= 1e8) return (v / 1e8).toFixed(2) + " 億";
        if (v >= 1e4) return (v / 1e4).toFixed(2) + " 萬";
        return Math.round(v).toLocaleString();
      }

      function pnlVal(d) {
        if (d.invested == null || d.reinvest.market_value == null) return null;
        return d.reinvest.market_value - d.invested;
      }
      function pnlStr(v) {
        if (v == null) return "—";
        return (v >= 0 ? "+" : "") + Math.round(v).toLocaleString();
      }

      function sortValue(d, key) {
        if (key === "invested") return d.invested ?? -Infinity;
        if (key === "market_value") return d.reinvest.market_value ?? -Infinity;
        if (key === "last_price") return d.last_price ?? -Infinity;
        if (key === "market_cap") return d.market_cap ?? -Infinity;
        if (key === "pnl") return pnlVal(d) ?? -Infinity;
        const v = d.reinvest[key];
        if (v == null) return -Infinity;
        return key === "max_drawdown" ? Math.abs(v) : v;
      }

      function renderToggles() {
        return (
          '<span class="label">欄位：</span>' +
          COL_DEFS.map(
            (c) =>
              `<button class="col-chip ${_visibleCols.has(c.key) ? "on" : ""}" onclick="toggleCol('${c.key}')">${c.label}</button>`,
          ).join("")
        );
      }

      function toggleCol(key) {
        if (_visibleCols.has(key)) _visibleCols.delete(key);
        else _visibleCols.add(key);
        document.getElementById("col-toggles").innerHTML = renderToggles();
        document.getElementById("table-container").innerHTML = renderTable();
      }

      function renderTable() {
        const filtered = applyFilters(_results);
        if (!filtered.length) {
          return _results.length
            ? '<div class="loading-msg">無符合篩選條件的資料</div>'
            : '<div class="loading-msg">資料尚未就緒，請稍後重新整理</div>';
        }

        const vis = (key) => _visibleCols.has(key);
        const sorted = [...filtered].sort(
          (a, b) => sortValue(b, _sortKey) - sortValue(a, _sortKey),
        );

        const maxIrr = Math.max(
          ...sorted.map((d) => Math.abs(d.reinvest.irr ?? 0)),
        );
        const maxDd = Math.max(
          ...sorted.map((d) => Math.abs(d.reinvest.max_drawdown ?? 0)),
        );
        const maxCalmar = Math.max(
          ...sorted.map((d) => d.reinvest.calmar ?? 0),
        );

        const rows = sorted
          .map((d, i) => {
            const re = d.reinvest;
            const irrBarW =
              maxIrr > 0
                ? Math.round((Math.abs(re.irr ?? 0) / maxIrr) * 60)
                : 0;
            const ddBarW =
              maxDd > 0
                ? Math.round((Math.abs(re.max_drawdown ?? 0) / maxDd) * 60)
                : 0;
            const calmarBarW =
              maxCalmar > 0
                ? Math.round(((re.calmar ?? 0) / maxCalmar) * 60)
                : 0;
            const calmarClass =
              re.calmar == null
                ? ""
                : re.calmar >= 1
                  ? "pos"
                  : re.calmar >= 0.5
                    ? "mid"
                    : "neg";
            const pnl = pnlVal(d);
            return `
            <tr>
              <td>${i + 1}</td>
              <td><div class="ticker">${d.ticker}</div><div class="name">${d.name}</div></td>
              ${vis("invested") ? `<td>${moneyStr(d.invested)}</td>` : ""}
              ${vis("shares") ? `<td>${sharesStr(re.shares)}</td>` : ""}
              ${vis("market_value") ? `<td>${moneyStr(re.market_value)}</td>` : ""}
              ${vis("last_price") ? `<td>${d.last_price != null ? d.last_price.toLocaleString() : "—"}</td>` : ""}
              ${vis("market_cap") ? `<td>${mktCapStr(d.market_cap)}</td>` : ""}
              ${vis("pnl") ? `<td><span class="${rateClass(pnl)}">${pnlStr(pnl)}</span></td>` : ""}
              ${vis("return_rate") ? `<td><span class="${rateClass(re.return_rate)}">${rateStr(re.return_rate)}</span></td>` : ""}
              ${vis("irr") ? `<td><div class="bar-wrap"><span class="${rateClass(re.irr)}">${rateStr(re.irr)}</span><div class="bar" style="width:${irrBarW}px"></div></div></td>` : ""}
              ${vis("max_drawdown") ? `<td><div class="bar-wrap"><span class="neg">${re.max_drawdown != null ? re.max_drawdown.toFixed(2) + "%" : "—"}</span><div class="bar neg-bar" style="width:${ddBarW}px"></div></div></td>` : ""}
              ${vis("calmar") ? `<td><div class="bar-wrap"><span class="${calmarClass}">${re.calmar != null ? re.calmar.toFixed(2) : "—"}</span><div class="bar" style="width:${calmarBarW}px"></div></div></td>` : ""}
            </tr>`;
          })
          .join("");

        const arrow = "▼";
        function thClass(key) {
          return _sortKey === key ? "th-active" : "th-sort";
        }
        function thLabel(key, label) {
          return `<th class="${thClass(key)}" onclick="setSort('${key}')">${label} <span class="sort-arrow">${_sortKey === key ? arrow : "↕"}</span></th>`;
        }

        return `
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>標的</th>
                ${vis("invested") ? thLabel("invested", "成本") : ""}
                ${vis("shares") ? "<th>股數</th>" : ""}
                ${vis("market_value") ? thLabel("market_value", "市值") : ""}
                ${vis("last_price") ? thLabel("last_price", "收盤價") : ""}
                ${vis("market_cap") ? thLabel("market_cap", "股票市值") : ""}
                ${vis("pnl") ? thLabel("pnl", "損益") : ""}
                ${vis("return_rate") ? thLabel("return_rate", "總報酬") : ""}
                ${vis("irr") ? thLabel("irr", "XIRR") : ""}
                ${vis("max_drawdown") ? thLabel("max_drawdown", "最大回撤") : ""}
                ${vis("calmar") ? thLabel("calmar", "Calmar") : ""}
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>`;
      }

      function setSort(key) {
        _sortKey = key;
        document.getElementById("table-container").innerHTML = renderTable();
      }

      function setPeriod(key, btn) {
        _results = _cache["results_" + key] || [];
        document
          .querySelectorAll(".period-btn")
          .forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        const first = _results[0];
        if (first) {
          document.getElementById("period-text").textContent =
            `${first.start_date} ～ ${first.end_date}`;
        }
        document.getElementById("filter-bar").innerHTML = renderFilterBar();
        document.getElementById("table-container").innerHTML = renderTable();
      }

      async function load() {
        try {
          const res = await fetch("/api/dca");
          const data = await res.json();
          const err = document.getElementById("error-banner");
          if (data.error) {
            err.style.display = "block";
            err.textContent = "資料更新失敗：" + data.error;
          } else {
            err.style.display = "none";
          }
          document.getElementById("last-updated").textContent =
            data.last_updated || "—";

          _cache = {
            results_10y: data.results_10y || [],
            results_5y: data.results_5y || [],
            results_crash_10y: data.results_crash_10y || [],
            results_crash_5y: data.results_crash_5y || [],
          };
          _results = _cache.results_10y;
          const first = _results[0];
          if (first) {
            document.getElementById("period-text").textContent =
              `${first.start_date} ～ ${first.end_date}`;
          }
          document.getElementById("filter-bar").innerHTML = renderFilterBar();
          document.getElementById("table-container").innerHTML = renderTable();
        } catch (e) {
          console.error(e);
        }
      }

      document.getElementById("col-toggles").innerHTML = renderToggles();
      load();
