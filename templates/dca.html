<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>定期定額試算</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC",
          sans-serif;
        background: #f0f2f5;
        color: #333;
      }

      header {
        background: #1a1a2e;
        color: #fff;
        padding: 16px 20px;
        display: flex;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
      }
      header a {
        color: #94a3b8;
        font-size: 0.82rem;
        text-decoration: none;
        border: 1px solid #334155;
        padding: 4px 10px;
        border-radius: 5px;
      }
      header a:hover {
        color: #e2e8f0;
        border-color: #475569;
      }
      header h1 {
        font-size: 1.1rem;
        font-weight: 600;
      }
      .meta {
        margin-left: auto;
        font-size: 0.78rem;
        color: #94a3b8;
      }
      .meta b {
        color: #cbd5e1;
      }

      #error-banner {
        display: none;
        background: #fee2e2;
        color: #b91c1c;
        padding: 10px 20px;
        font-size: 0.85rem;
      }

      .container {
        max-width: 820px;
        margin: 24px auto;
        padding: 0 14px;
      }

      .info-bar {
        background: #fff;
        border-radius: 10px;
        padding: 14px 20px;
        margin-bottom: 16px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.07);
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        align-items: center;
        font-size: 0.85rem;
        color: #475569;
      }
      .info-bar b {
        color: #1e293b;
      }
      .info-bar .period {
        margin-left: auto;
        font-size: 0.82rem;
        color: #64748b;
      }
      .info-bar .period b {
        color: #334155;
      }

      .table-wrap {
        background: #fff;
        border-radius: 10px;
        box-shadow: 0 1px 6px rgba(0, 0, 0, 0.08);
        overflow: hidden;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.85rem;
      }

      thead tr {
        background: #1e293b;
        color: #e2e8f0;
      }
      thead th {
        padding: 11px 16px;
        font-weight: 600;
        text-align: right;
        white-space: nowrap;
      }
      thead th:nth-child(1) {
        text-align: center;
        width: 40px;
      }
      thead th:nth-child(2) {
        text-align: left;
      }

      tbody tr {
        border-bottom: 1px solid #f1f5f9;
        transition: background 0.1s;
      }
      tbody tr:last-child {
        border-bottom: none;
      }
      tbody tr:hover {
        background: #f8fafc;
      }

      td {
        padding: 11px 16px;
        text-align: right;
        white-space: nowrap;
      }
      td:nth-child(1) {
        text-align: center;
        color: #94a3b8;
        font-size: 0.78rem;
        font-weight: 600;
      }
      td:nth-child(2) {
        text-align: left;
      }

      .ticker {
        font-weight: 700;
        color: #1e293b;
        font-size: 0.88rem;
      }
      .name {
        color: #64748b;
        font-size: 0.76rem;
        margin-top: 1px;
      }

      .pos {
        color: #16a34a;
        font-weight: 700;
      }
      .neg {
        color: #dc2626;
        font-weight: 700;
      }
      .sub {
        font-size: 0.76rem;
        color: #64748b;
        margin-top: 2px;
      }

      .bar-wrap {
        display: flex;
        align-items: center;
        gap: 10px;
        justify-content: flex-end;
      }
      .bar {
        height: 6px;
        border-radius: 3px;
        min-width: 2px;
        background: #16a34a;
        flex-shrink: 0;
      }
      .bar.neg-bar {
        background: #dc2626;
      }

      .loading-msg {
        padding: 48px;
        text-align: center;
        color: #94a3b8;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <header>
      <a href="/">← 漲跌日排行</a>
      <h1>定期定額試算</h1>
      <div class="meta">更新：<b id="last-updated">載入中…</b></div>
    </header>

    <div id="error-banner"></div>

    <div class="container">
      <div class="info-bar" id="info-bar">
        <span
          >每月 <b>5 日</b> 投入 <b>1,000,000 元</b>・最小單位
          <b>1 股</b>・股息隔天再投入</span
        >
        <span class="period">回測期間：<b id="period-text">載入中…</b></span>
      </div>

      <div class="table-wrap">
        <div id="table-container">
          <div class="loading-msg">資料載入中，首次約需 60 秒…</div>
        </div>
      </div>
    </div>

    <script>
      function rateStr(r) {
        if (r == null) return "—";
        return (r >= 0 ? "+" : "") + r.toFixed(2) + "%";
      }
      function rateClass(r) {
        if (r == null) return "";
        return r >= 0 ? "pos" : "neg";
      }

      function renderTable(results) {
        if (!results || !results.length) {
          return '<div class="loading-msg">資料尚未就緒，請稍後重新整理</div>';
        }

        // 按 IRR 降冪排序
        const sorted = [...results].sort((a, b) => {
          const ia = a.reinvest.irr ?? -Infinity;
          const ib = b.reinvest.irr ?? -Infinity;
          return ib - ia;
        });

        const maxIrr = Math.max(
          ...sorted.map((d) => Math.abs(d.reinvest.irr ?? 0)),
        );

        const maxDd = Math.max(
          ...sorted.map((d) => Math.abs(d.reinvest.max_drawdown ?? 0)),
        );

        const rows = sorted
          .map((d, i) => {
            const re = d.reinvest;
            const irrBarW =
              maxIrr > 0
                ? Math.round((Math.abs(re.irr ?? 0) / maxIrr) * 72)
                : 0;
            const ddBarW =
              maxDd > 0
                ? Math.round((Math.abs(re.max_drawdown ?? 0) / maxDd) * 72)
                : 0;
            return `
            <tr>
              <td>${i + 1}</td>
              <td>
                <div class="ticker">${d.ticker}</div>
                <div class="name">${d.name}</div>
              </td>
              <td>
                <div class="bar-wrap">
                  <span class="${rateClass(re.irr)}">${rateStr(re.irr)}</span>
                  <div class="bar" style="width:${irrBarW}px"></div>
                </div>
              </td>
              <td>
                <div class="bar-wrap">
                  <span class="neg">${re.max_drawdown != null ? re.max_drawdown.toFixed(2) + "%" : "—"}</span>
                  <div class="bar neg-bar" style="width:${ddBarW}px"></div>
                </div>
              </td>
            </tr>`;
          })
          .join("");

        return `
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>標的</th>
                <th>年化報酬率（IRR）</th>
                <th>最大回撤</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>`;
      }

      async function load() {
        try {
          const res = await fetch("/api/dca");
          const data = await res.json();
          const err = document.getElementById("error-banner");
          if (data.error) {
            err.style.display = "block";
            err.textContent = "資料更新失敗：" + data.error;
          } else {
            err.style.display = "none";
          }
          document.getElementById("last-updated").textContent =
            data.last_updated || "—";

          if (data.results && data.results.length) {
            const first = data.results[0];
            document.getElementById("period-text").textContent =
              `${first.start_date} ～ ${first.end_date}`;
          }

          document.getElementById("table-container").innerHTML = renderTable(
            data.results,
          );
        } catch (e) {
          console.error(e);
        }
      }

      load();
    </script>
  </body>
</html>
